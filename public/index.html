<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>P3 Learning App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  /* Night-terrarium palette — same as the Muse version */
  --bg:#17163a; --bg2:#1d1b47; --panel:#232154; --panel2:#2c2966;
  --ink:#f5f1e6; --ink-soft:#b9b4d9; --line:#3a3677;
  --amber:#ffc94d; --amber-d:#e0a92e; --teal:#57b06a; --teal-soft:#1e4034;
  --coral:#ff8a7a; --coral-soft:#4c2a33; --sky:#7cc4ff; --sky-soft:#1e3a5f;
  --green:#8fd18b; --green-soft:#1e4034; --gold:#ffc94d;
  --nav:#100f2c; --nav-ink:#f5f1e6; --shadow:0 10px 30px rgba(0,0,0,.4);
  --card:#fffaf0; --card-text:#2a2753;
  --tint:rgba(46,160,90,.30); --glow:#7be495;
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Nunito",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
h1,h2,h3,.display{font-family:"Fredoka","Nunito",sans-serif}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--sky)}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:228px;flex:0 0 228px;background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .bname{font-family:"Fredoka";font-weight:800;font-size:1.15rem;line-height:1.1}
.brand .bsub{font-size:.72rem;opacity:.75;font-weight:700}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;background:transparent;border:0;color:var(--nav-ink);padding:11px 12px;border-radius:12px;font-size:.98rem;font-weight:800;text-align:left;margin-bottom:4px}
.navbtn .nic{font-size:1.15rem;width:24px;text-align:center}
.navbtn:hover{background:rgba(255,255,255,.08)}
.navbtn.active{background:var(--amber);color:#231a02}
.sidebar .spacer{flex:1}
.doorlink{font-size:.8rem;opacity:.85;text-align:center;padding:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 20px;position:sticky;top:0;background:var(--bg);z-index:20;border-bottom:2px solid var(--line)}
.topbar .page-title{font-family:"Fredoka";font-weight:800;font-size:1.3rem}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:900;font-size:.9rem}
.iconbtn{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:1.1rem;display:inline-flex;align-items:center;justify-content:center}
.iconbtn.on{background:var(--amber);border-color:var(--amber)}
.avatarbtn{width:46px;height:46px;border-radius:50%;border:3px solid var(--amber);background:var(--panel);padding:0;overflow:hidden;display:inline-flex}
.content{padding:20px;max-width:1080px;width:100%;margin:0 auto}
.view{display:none}
.view.active{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.view.active{animation:none}}

/* ---------- Generic ---------- */
.card{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 6px}
.muted{color:var(--ink-soft)}
.small{font-size:.85rem}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:#231a02;border:0;border-radius:999px;padding:11px 20px;font-weight:900;font-size:1rem;box-shadow:0 4px 0 var(--amber-d)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--amber-d)}
.btn.teal{background:var(--teal);color:#fff;box-shadow:0 4px 0 #2f6b3a}
.btn.ghost{background:var(--panel);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 4px 0 #9f1239}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c4{grid-template-columns:repeat(4,1fr)}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:.75rem;font-weight:900}
.pill.eng{background:var(--sky-soft);color:var(--sky)}
.pill.math{background:var(--panel2);color:var(--amber-d)}
.pill.sci{background:var(--green-soft);color:var(--green)}
.pill.chi{background:var(--coral-soft);color:var(--coral)}
.pill.done{background:var(--green-soft);color:var(--green)}
.pill.prog{background:var(--panel2);color:var(--amber-d)}
.progressbar{height:12px;background:var(--bg);border:2px solid var(--line);border-radius:999px;overflow:hidden}
.progressbar>div{height:100%;background:var(--teal);border-radius:999px;transition:width .4s}

/* ---------- Door ---------- */
.doorwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:
  linear-gradient(rgba(16,15,44,.62),rgba(16,15,44,.62)), url(assets/terrarium.webp) center/cover no-repeat, var(--bg)}
.doorcard{max-width:560px;width:100%;text-align:center}
.doorcard h1{font-size:2.1rem;margin:8px 0 2px}
.codebubbles{display:flex;gap:12px;justify-content:center;margin:16px 0}
.codebubbles .bub{width:64px;height:64px;border-radius:50%;border:3px dashed var(--line);background:var(--panel);font-size:1.9rem;display:flex;align-items:center;justify-content:center}
.codebubbles .bub.filled{border-style:solid;border-color:var(--amber)}
.picgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}
.picbtn{font-size:1.8rem;padding:10px 0;border-radius:14px;border:2px solid var(--line);background:var(--panel)}
.picbtn:hover{border-color:var(--amber);transform:scale(1.06)}
.explorerrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:14px 0}
.explorerchip{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-weight:900}
.explorerchip:hover{border-color:var(--amber)}
.explorerchip .face{font-size:2rem}
.field{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-size:1rem;font-weight:700}
label.flabel{display:block;font-weight:900;margin:12px 0 6px;text-align:left}

/* ---------- Home / Pip ---------- */
.hero{display:flex;gap:18px;align-items:center}
.pipwrap{flex:0 0 128px;text-align:center}
.pipwrap svg{width:128px;height:128px}
.pipname{font-family:"Fredoka";font-weight:800}
.speech{background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:12px 14px;position:relative;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:2px solid var(--gold);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:900;font-size:.85rem;margin:3px}

/* ---------- Quiz ---------- */
.optbtn{display:block;width:100%;text-align:left;background:var(--panel);border:2.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.05rem;font-weight:800;color:var(--ink);margin-bottom:10px}
.optbtn:hover{border-color:var(--sky)}
.optbtn.picked{border-color:var(--sky);background:var(--sky-soft)}
.optbtn.right{border-color:var(--green);background:var(--green-soft);animation:pop .35s ease}
.optbtn.wrong{border-color:var(--coral);background:var(--coral-soft)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
.feedback{border-radius:14px;padding:14px 16px;font-weight:800;margin:10px 0}
.feedback.ok{background:var(--green-soft)}
.feedback.no{background:var(--coral-soft)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:1.5rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(340deg)}}
.trophy{font-size:4rem;animation:pop .5s ease infinite alternate;display:inline-block}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.bouncy{animation:bounce 1s ease infinite}
@media (prefers-reduced-motion: reduce){.trophy,.bouncy,.confetti span{animation:none}}

/* ---------- Play ---------- */
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:440px}
.memcard{aspect-ratio:1;border-radius:14px;border:2.5px solid var(--line);background:var(--nav);color:#fff;font-size:1.7rem;display:flex;align-items:center;justify-content:center;font-weight:900}
.memcard.open{background:var(--panel);color:var(--ink)}
.memcard.matched{background:var(--green-soft);border-color:var(--green)}
.bigq{font-size:1.5rem;font-weight:900;text-align:center;padding:10px}

/* ---------- Ask Pip ---------- */
.threadrow{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:800;color:var(--ink);margin-bottom:8px}
.threadrow.active{border-color:var(--amber)}
.chatlog{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:6px 2px}
.msg{max-width:82%;padding:11px 14px;border-radius:16px;font-weight:700;line-height:1.45;white-space:pre-wrap}
.msg.kid{align-self:flex-end;background:var(--sky);color:#fff;border-bottom-right-radius:4px}
.msg.pip{align-self:flex-start;background:var(--panel2);border:2px solid var(--line);border-bottom-left-radius:4px}
.chatbar{display:flex;gap:8px;margin-top:12px}
.chatbar input{flex:1}

/* ---------- Critter / Treasure ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:14px;border:2.5px solid var(--line);background:var(--panel);font-weight:900;font-size:.85rem;text-align:center}
.stage .se{font-size:2.2rem}
.stage.sel{border-color:var(--teal);background:var(--teal-soft)}
.treasure{display:flex;gap:14px;align-items:flex-start}
.treasure .te{font-size:2.4rem;flex:0 0 auto}

/* ---------- Parent ---------- */
table.ledger{width:100%;border-collapse:collapse}
table.ledger th,table.ledger td{padding:9px 10px;border-bottom:2px solid var(--line);text-align:left;font-weight:700}
.pinDots{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pinDots .d{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink-soft)}
.pinDots .d.f{background:var(--amber);border-color:var(--amber)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.keypad button{padding:14px 0;font-size:1.25rem;font-weight:900;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink)}

/* ---------- Menu / modal ---------- */
.menu{position:absolute;top:64px;right:16px;width:290px;background:var(--panel);border:2px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;z-index:60}
.menu button.mitem{display:flex;gap:10px;align-items:center;width:100%;background:var(--panel2);border:0;border-radius:12px;padding:13px;font-weight:900;font-size:.98rem;color:var(--ink);margin-bottom:8px;text-align:left}
.overlay{position:fixed;inset:0;background:rgba(8,10,30,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--panel);border-radius:20px;max-width:480px;width:100%;padding:22px;max-height:90vh;overflow-y:auto;border:2px solid var(--line)}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--nav);color:#fff;padding:11px 20px;border-radius:999px;font-weight:900;z-index:95;display:none;box-shadow:var(--shadow)}
.bottomnav{display:none}
.starsRow{font-size:1.6rem;letter-spacing:4px}

/* ---------- Pip: 3D animated otter (Mira-style) ---------- */
.otter3d{display:inline-block;animation:otterFloat 3.2s ease-in-out infinite;transform-style:preserve-3d;perspective:600px;vertical-align:middle}
.otter3d .otter-ring{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;animation:otterTilt 5s ease-in-out infinite}
.otter3d img{width:100%;height:100%;object-fit:cover;object-position:50% 32%;display:block;transform:scale(1.22)}
.otter3d .otter-shine{position:absolute;inset:0;border-radius:50%;background:linear-gradient(125deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,0) 42%);pointer-events:none}
@keyframes otterFloat{0%,100%{transform:translateY(0) rotate(-1.6deg)}50%{transform:translateY(-7px) rotate(1.6deg)}}
@keyframes otterTilt{0%,100%{transform:rotateY(-7deg) rotateX(3deg)}50%{transform:rotateY(7deg) rotateX(-3deg)}}
.otter3d .eye{transform-box:fill-box;transform-origin:center;animation:otterBlink 4.4s infinite}
@keyframes otterBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.otter3d .pawwave{transform-box:fill-box;transform-origin:20% 85%;animation:otterWave 2.6s ease-in-out infinite}
@keyframes otterWave{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-22deg)}}
.otter3d .leafsway{transform-box:fill-box;transform-origin:50% 100%;animation:leafSway 3s ease-in-out infinite}
@keyframes leafSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(6deg)}}
.otter3d .earl{transform-box:fill-box;transform-origin:80% 80%;animation:earWig 5s ease-in-out infinite}
.otter3d .earr{transform-box:fill-box;transform-origin:20% 80%;animation:earWig 5s ease-in-out infinite reverse}
@keyframes earWig{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-9deg)}96%{transform:rotate(7deg)}}
.otter3d .tongue{transform-box:fill-box;transform-origin:50% 0;animation:tongueWig 3.4s ease-in-out infinite}
@keyframes tongueWig{0%,100%{transform:rotate(-2deg) scaleY(1)}50%{transform:rotate(3deg) scaleY(1.08)}}
@media (prefers-reduced-motion: reduce){.otter3d,.otter3d .eye,.otter3d .pawwave,.otter3d .leafsway,.otter3d .earl,.otter3d .earr,.otter3d .tongue{animation:none}}
/* ---------- Home: terrarium hero + weekly theme (mirrors the Muse version) ---------- */
.disc{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.sidecritter{background:var(--panel);border-radius:var(--radius);padding:14px}
.homegrid{display:grid;gap:20px}
.cardrow{display:grid;gap:16px;margin-top:20px}
@media (min-width:900px){
  .homegrid{grid-template-columns:3fr 2fr}
  .cardrow{grid-template-columns:repeat(3,1fr)}
}
.heroT{position:relative;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff}
.heroT img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.heroT .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(16,15,44,.95),rgba(16,15,44,.35) 55%,transparent)}
.heroT .tintwash{position:absolute;inset:0;background:linear-gradient(to top,var(--tint),transparent 70%);box-shadow:inset 0 0 90px var(--tint);transition:background .7s,box-shadow .7s}
.heroT .inner{position:relative;padding:22px}
.heroT .bubble{background:rgba(0,0,0,.35);border-radius:16px;padding:12px 14px;font-weight:600;color:#f5f1e6;max-width:460px}
.heroT .memory{background:rgba(0,0,0,.35);border-radius:16px;padding:10px 14px;font-weight:700;font-size:.9rem;color:#ffe9a8;max-width:460px;margin-top:8px}
.themeslabel{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(245,241,230,.8)}
.themechip{border:0;border-radius:999px;padding:8px 15px;font-weight:700;font-size:.92rem;background:rgba(0,0,0,.4);color:#fff;transition:transform .15s;font-family:"Fredoka","Nunito",sans-serif}
.themechip.sel{background:var(--gold);color:#2a2753;transform:scale(1.05);box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.themeline{margin-top:10px;font-size:.92rem;font-weight:700;color:var(--glow)}
.questcard{background:var(--card);color:var(--card-text);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.questcard .muted{color:#6d6899}
.questcard .progressbar{background:#e8e2d0;border-color:#e8e2d0}
.questcard .progressbar>div{background:#57b06a}
.questcard .btn{background:#57b06a;color:#fff;box-shadow:0 4px 0 #2f6b3a;width:100%;justify-content:center}
.swapbox{border-radius:16px;padding:10px 8px;text-align:center;font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:.92rem;border:0;width:100%}
.stageimg{width:100%;height:170px;object-fit:cover;border-radius:14px;display:block}
.cardimg{width:100%;height:144px;object-fit:cover;display:block}
.stage .simg{width:100%;height:64px;object-fit:cover;border-radius:10px}
.tilebtn{display:block;width:100%;text-align:left;background:rgba(0,0,0,.25);border:0;border-radius:16px;padding:12px 14px;color:var(--ink);font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:1rem}
.tilebtn span{display:block;font-family:"Nunito",sans-serif;font-size:.78rem;font-weight:700;color:var(--ink-soft);margin-top:2px}
.breathe{width:120px;height:120px;border-radius:50%;background:var(--teal);opacity:.75;margin:14px auto;transition:transform 4s ease-in-out}
/* ---------- Inner pages: same terrarium treatment as Home ---------- */
.pagehero{position:relative;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);color:#fff;margin-bottom:18px}
.pagehero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pagehero .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(16,15,44,.94),rgba(16,15,44,.45) 60%,rgba(16,15,44,.25))}
.pagehero .tintwash{position:absolute;inset:0;background:linear-gradient(to top,var(--tint),transparent 75%);box-shadow:inset 0 0 90px var(--tint)}
.pagehero .inner{position:relative;padding:20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pagehero .heroicon{font-size:2.5rem;background:rgba(0,0,0,.35);border-radius:18px;width:70px;height:70px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pagehero h2{margin:0;font-size:1.55rem;color:#fff;line-height:1.15}
.pagehero p{margin:5px 0 0;font-weight:700;color:#e9e5ff;max-width:540px}
.pagehero .herostat{background:rgba(0,0,0,.35);border-radius:14px;padding:8px 14px;font-weight:900;font-size:.92rem;color:#ffe9a8}
.flowhero{display:flex;gap:12px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.subjecthead{display:flex;align-items:center;gap:11px;margin:24px 0 12px}
.subjecthead .sdisc{width:44px;height:44px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:1.3rem;flex:0 0 auto}
.subjecthead h3{margin:0;font-size:1.25rem}
.subjecthead .small{font-weight:700}
.learncard{display:flex;flex-direction:column}
.learncard .iconrow{display:flex;align-items:center;gap:10px}
.learncard .qicon{width:46px;height:46px;border-radius:14px;background:#efe9dc;display:inline-flex;align-items:center;justify-content:center;font-size:1.45rem;flex:0 0 auto}
.gamecard{padding:0;overflow:hidden;display:flex;flex-direction:column}
.gameband{height:104px;display:flex;align-items:center;justify-content:center;font-size:3.4rem}
.gamecard .gbody{padding:16px;display:flex;flex-direction:column;flex:1}
.tdisc{width:62px;height:62px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.9rem;flex:0 0 auto}
.tdisc.owned{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,77,.28)}
.flashcard{display:block;width:100%;background:var(--card);color:var(--card-text);border:0;border-radius:14px;padding:16px;font-weight:900;font-size:1.05rem;min-height:76px;box-shadow:var(--shadow);text-align:center}
.flashcard.back{background:#ffe9a8;color:#2a2753}
.flashcard .fside{display:block;font-size:.7rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-bottom:4px}
.plannerow{display:flex;gap:10px;align-items:center;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-weight:800}
.plannerow .ptext{flex:1}
.plannerow.done .ptext{text-decoration:line-through;opacity:.65}
.tickbtn{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--amber);background:transparent;color:var(--amber);font-weight:900;flex:0 0 auto;font-size:1rem;line-height:1}
.tickbtn.done{background:var(--teal);border-color:var(--teal);color:#fff}
.delbtn{background:transparent;border:0;color:var(--ink-soft);font-size:1.05rem;flex:0 0 auto;padding:4px}
@media (max-width:820px){
  .bottomnav button{font-size:.6rem}

<script>
/* ============================================================
   Jiyuna's Learning App — hosted version
   Progress is saved per explorer in browser storage AND synced
   to the server under a random 6-letter family sync code, so any
   device linked with that code shares the same family record.
   No child's real name is ever used as a server identifier.
   ============================================================ */

/* ---------- Cute funny otter Pip (hand-drawn SVG) ---------- */
function pipSVG(size, glow){
  glow = glow || '#ffb020';
  return '<span class="otter3d" style="width:'+size+'px;height:'+size+'px">'
   + '<span class="otter-ring" style="box-shadow:0 0 0 3px '+glow+', 0 12px 22px rgba(15,20,50,.35), inset 0 -14px 24px rgba(0,0,0,.18)">'
   + '<img src="assets/pip-otter.png" alt="Pip the otter" width="'+size+'" height="'+size+'" draggable="false">'
   + '<span class="otter-shine"></span></span></span>';
}
/* ---------- Sound engine (WebAudio, no files) ---------- */
var AC=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(freq,t0,dur,type,vol){
  var ac=audio(); if(!ac)return;
  var o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  var s=ac.currentTime+t0;
  g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(vol||0.16,s+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
  o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s+dur+0.05);
}
function sndCorrect(){ [523,659,784,1047].forEach(function(f,i){ tone(f,i*0.07,0.22,'triangle',0.18); }); tone(1319,0.3,0.3,'sine',0.14); tone(1568,0.38,0.34,'sine',0.1); }
function sndWrong(){ tone(220,0,0.18,'sine',0.1); tone(196,0.12,0.22,'sine',0.1); }
function sndFanfare(){ [523,659,784,1047,784,1047,1319].forEach(function(f,i){ tone(f,i*0.11,0.3,'triangle',0.18); }); [262,330,392].forEach(function(f){ tone(f,0.75,0.7,'sine',0.08); }); }
function sndPop(){ tone(880,0,0.09,'square',0.06); }
/* Forest Morning — the ONLY background sound: soft pad + gentle birdsong chirps */
var forestOn=false, forestNodes=[], forestTimer=null;
function startForest(){
  var ac=audio(); if(!ac)return;
  stopForest(true);
  var master=ac.createGain(); master.gain.value=0.14; master.connect(ac.destination); forestNodes.push(master);
  [196,246.9,293.7].forEach(function(f){
    var o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.value=f; g.gain.value=0.05;
    var lfo=ac.createOscillator(), lg=ac.createGain(); lfo.frequency.value=0.07; lg.gain.value=0.02;
    lfo.connect(lg); lg.connect(g.gain); o.connect(g); g.connect(master); o.start(); lfo.start();
    forestNodes.push(o,lfo);
  });
  function chirp(){
    if(!forestOn)return;
    var base=2200+Math.random()*1400, t=ac.currentTime;
    for(var i=0;i<3;i++){
      var o=ac.createOscillator(), g=ac.createGain(); o.type='sine';
      o.frequency.setValueAtTime(base,t+i*0.16); o.frequency.exponentialRampToValueAtTime(base*1.25,t+i*0.16+0.07);
      g.gain.setValueAtTime(0.0001,t+i*0.16); g.gain.exponentialRampToValueAtTime(0.05,t+i*0.16+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.16+0.13);
      o.connect(g); g.connect(master); o.start(t+i*0.16); o.stop(t+i*0.16+0.15);
    }
    forestTimer=setTimeout(chirp, 2600+Math.random()*3800);
  }
  forestOn=true; chirp();
}
function stopForest(silent){
  forestOn=false; if(forestTimer)clearTimeout(forestTimer);
  forestNodes.forEach(function(n){ try{n.stop&&n.stop()}catch(e){} try{n.disconnect()}catch(e){} }); forestNodes=[];
  if(!silent)renderTop();
}
/* Pip read-aloud: warmest available voice, sentence by sentence */
function speakPip(text){
  if(!('speechSynthesis' in window)){ toast('Sorry — this device has no read-aloud voice.'); return; }
  if(!speechSynthesis.getVoices().length){
    var once=function(){ speechSynthesis.onvoiceschanged=null; speakPip(text); };
    speechSynthesis.onvoiceschanged=once;
    setTimeout(function(){ if(speechSynthesis.onvoiceschanged===once){ speechSynthesis.onvoiceschanged=null; speakPip(text); } },1200);
    return;
  }
  speechSynthesis.cancel();
  var voices=speechSynthesis.getVoices();
  function pick(lang){
    var vs=voices.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf(lang)===0;});
    if(!vs.length)vs=voices;
    var good=['natural','neural','google','samantha','zira','jenny','aria','xiaoxiao','tingting','meijia'];
    for(var i=0;i<good.length;i++){ var m=vs.filter(function(v){return v.name.toLowerCase().indexOf(good[i])>=0;}); if(m.length)return m[0]; }
    var bad=['fred','albert','bad news','organ','cellos','zarvox','trinoids','robot'];
    var ok=vs.filter(function(v){ var n=v.name.toLowerCase(); return !bad.some(function(b){return n.indexOf(b)>=0;}); });
    return (ok[0]||vs[0]);
  }
  var isChi=/[\u4e00-\u9fff]/.test(text);
  var parts=text.match(/[^.!?。！？]+[.!?。！？]*/g)||[text];
  parts.forEach(function(p){
    var u=new SpeechSynthesisUtterance(p.trim());
    var v=pick(isChi?'zh':'en'); if(v)u.voice=v;
    u.lang=isChi?'zh-CN':'en-SG'; u.rate=0.98; u.pitch=1.12;
    speechSynthesis.speak(u);
  });
}
if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=function(){ speechSynthesis.getVoices(); }; }
</script>

function skillForQuestionClient(text){
  var q=String(text||'').toLowerCase();
  if(/\d\s*[x\u00d7*]\s*\d/.test(q))return SKILL_PACK.skills.find(function(x){return x.id==='times-tables';});
  if(/\d\s*[+\-]\s*\d/.test(q))return SKILL_PACK.skills.find(function(x){return x.id==='add-subtract';});
  var best=null, bestScore=0;
  SKILL_PACK.skills.forEach(function(sk){
    var sc=0; sk.keywords.forEach(function(kw){ if(q.indexOf(kw.toLowerCase())>=0)sc+=kw.length>4?2:1; });

<script>
/* ============================================================
   STATE — saved per explorer, in browser storage and synced to
   the server under the family sync code (see the sync block below)
   ============================================================ */
var LSKEY='jiyuna-learning-web-v1';
var DB=null;
/* Hosted: server sync. Device id is a random UUID in this browser only — no
   child's name is ever sent to the server. If the server is not configured
   (/api/progress answers configured:false) everything still works locally. */
/* --- Family sync code: the key that links devices -----------------
   A short random 6-letter code (no ambiguous 0/O, 1/I/L). It is NOT a
   name and it is NOT a password — anyone who knows it can pull the
   family progress, so grown-ups keep it like a house key and only
   share it with the family's own devices. The device UUID below is
   kept only as a fallback key for devices that have never been given
   a sync code. */
var SYNC_ALPHABET='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function makeSyncCode(){
  var c=''; for(var i=0;i<6;i++){ c+=SYNC_ALPHABET[Math.floor(Math.random()*SYNC_ALPHABET.length)]; } return c;
}
function normalizeSyncCode(v){ return String(v||'').toUpperCase().replace(/[\s\-]/g,''); }
function syncCodeValid(v){ return /^[A-Z2-9]{6}$/.test(String(v||'')) && String(v).split('').every(function(ch){ return SYNC_ALPHABET.indexOf(ch)>=0; }); }
function ensureSyncCode(){
  if(!DB)return null;
  if(!syncCodeValid(DB.syncCode))DB.syncCode=makeSyncCode();
  return DB.syncCode;
}
var DEVICE_ID=null;
try{ DEVICE_ID=localStorage.getItem('p3-device-id'); if(!DEVICE_ID){ DEVICE_ID='d-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); localStorage.setItem('p3-device-id',DEVICE_ID); } }catch(e){}
/* The server key: the family sync code when one exists, else the
   per-device fallback id. Every linked device shares the code, so
   they all read/write the same server row. */
function syncKey(){ return (DB&&syncCodeValid(DB.syncCode))?DB.syncCode:(DEVICE_ID||null); }
var syncTimer=null;
function saveLocal(){ try{ localStorage.setItem(LSKEY, JSON.stringify(DB)); }catch(e){} }
function syncToServer(){
  var key=syncKey(); if(!key||!DB)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){
    try{ fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:key,device:DEVICE_ID,data:DB})}).catch(function(){}); }catch(e){}
  },800);
}
/* Merge a server family record with the local one — a UNION, never a
   last-write-wins overwrite. Progress in this app only ever grows
   (stars, completed quests, badges, treasures, critter stage), so for
   an explorer that exists in both copies we keep the richer value of
   each field; an explorer that exists only on one side is kept. That
   way a device left open (whose per-minute screen-time save keeps
   bumping its timestamp) can never wipe out progress made on another
   device, and linking a device never deletes progress made on it
   before linking. */
function unionArr(a,b){ var out=(a||[]).slice(); (b||[]).forEach(function(x){ if(out.indexOf(x)<0)out.push(x); }); return out; }
function unionObjMax(a,b){ var o={}; Object.keys(a||{}).forEach(function(k){ o[k]=a[k]; }); Object.keys(b||{}).forEach(function(k){ o[k]=(o[k]==null?b[k]:Math.max(o[k],b[k])); }); return o; }
function mergeExplorer(a,b){
  var e=JSON.parse(JSON.stringify(a||b));
  if(!a)return JSON.parse(JSON.stringify(b)); if(!b)return JSON.parse(JSON.stringify(a));
  e.stars=Math.max(a.stars||0,b.stars||0);
  e.critterStage=Math.max(a.critterStage||0,b.critterStage||0);
  e.badges=unionArr(a.badges,b.badges);
  e.treasures=unionArr(a.treasures,b.treasures);
  e.discoveredCritters=unionArr(a.discoveredCritters,b.discoveredCritters);
  e.completed=unionObjMax(a.completed,b.completed);
  e.hclMissed=unionArr(a.hclMissed,b.hclMissed);
  e.favAnswers=unionArr(a.favAnswers,b.favAnswers);
  var prog={}; Object.keys(a.progress||{}).forEach(function(k){ prog[k]=a.progress[k]; });
  Object.keys(b.progress||{}).forEach(function(k){ var x=prog[k], y=b.progress[k]; prog[k]=(!x?y:{idx:Math.max(x.idx||0,y.idx||0),score:Math.max(x.score||0,y.score||0),wrong:unionArr(x.wrong,y.wrong),picked:x.picked||y.picked,answered:x.answered||y.answered,pool:x.pool||y.pool,fresh:x.fresh||y.fresh}); });
  e.progress=prog;
  var play={}; Object.keys(a.playProgress||{}).forEach(function(k){ play[k]=a.playProgress[k]; });
  Object.keys(b.playProgress||{}).forEach(function(k){ var x=play[k], y=b.playProgress[k]; play[k]=(!x?y:{idx:Math.max(x.idx||0,y.idx||0),score:Math.max(x.score||0,y.score||0),seed:x.seed||y.seed,matched:unionArr(x.matched,y.matched),moves:Math.max(x.moves||0,y.moves||0),won:x.won||y.won,deck:x.deck||y.deck}); });
  e.playProgress=play;
  var daily={}; Object.keys(a.daily||{}).forEach(function(k){ daily[k]=a.daily[k]; });
  Object.keys(b.daily||{}).forEach(function(k){ daily[k]=Math.max(daily[k]||0,b.daily[k]); });
  e.daily=daily; e.totalMinutes=Math.max(a.totalMinutes||0,b.totalMinutes||0);
  e.mood=Object.assign({},b.mood||{},a.mood||{});
  e.stuckCount=unionObjMax(a.stuckCount,b.stuckCount);
  e.threads=(a.threads||[]).concat((b.threads||[]).filter(function(t){ return !(a.threads||[]).some(function(x){ return x.title===t.title; }); }));
  e.flashcards=(a.flashcards||[]).concat((b.flashcards||[]).filter(function(f){ return !(a.flashcards||[]).some(function(x){ return x.q===f.q; }); }));
  e.planner=(a.planner||[]).concat((b.planner||[]).filter(function(f){ return !(a.planner||[]).some(function(x){ return x.t===f.t; }); }));
  e.critterName=(a.critterName&&b.critterName)?(a.critterName.length>=b.critterName.length?a.critterName:b.critterName):(a.critterName||b.critterName);
  return e;
}
function mergeFamilyDB(local, server){
  if(!server||!server.explorers)return local;
  if(!local||!local.explorers||!local.explorers.length)return JSON.parse(JSON.stringify(server));
  var merged=JSON.parse(JSON.stringify(server));
  merged.syncCode=server.syncCode||local.syncCode||null;
  merged.parentPin=server.parentPin||local.parentPin||null;
  merged.dailyLimit=(server.dailyLimit!=null?server.dailyLimit:(local.dailyLimit!=null?local.dailyLimit:30));
  merged.stageV=server.stageV||local.stageV||null;
  merged.updatedAt=(server.updatedAt&&local.updatedAt)?(server.updatedAt>local.updatedAt?server.updatedAt:local.updatedAt):(server.updatedAt||local.updatedAt||null);
  var byId={}; merged.explorers.forEach(function(e){ byId[e.id]=e; });
  (local.explorers||[]).forEach(function(e){
    if(byId[e.id]){ var i=merged.explorers.indexOf(byId[e.id]); merged.explorers[i]=mergeExplorer(byId[e.id], e); }
    else merged.explorers.push(JSON.parse(JSON.stringify(e)));
  });
  if(!merged.explorers.some(function(e){return e.id===merged.activeId;}))merged.activeId=local.activeId||merged.explorers[0].id;
  return merged;
}
function syncFromServer(opts){
  opts=opts||{};
  var key=syncKey(); if(!key)return Promise.resolve(false);
  return fetch('/api/progress?code='+encodeURIComponent(key)).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.configured||!j.data||!j.data.explorers)return false;
    var server=j.data, localEmpty=!DB.explorers||!DB.explorers.length;
    if(localEmpty){ DB=JSON.parse(JSON.stringify(server)); ensureSyncCode(); DB.updatedAt=j.updatedAt||DB.updatedAt||null; saveLocal(); syncToServer(); return true; }
    /* Always union-merge: timestamps are NOT trusted as a winner,
       because an open device's per-minute screen-time save keeps
       bumping its local timestamp. The merge keeps the richer side
       of every field, so nothing either device did is lost. */
    var before=JSON.stringify(DB);
    DB=mergeFamilyDB(DB, server); ensureSyncCode(); DB.updatedAt=j.updatedAt||DB.updatedAt||null;
    var changed=JSON.stringify(DB)!==before;
    if(changed){ saveLocal(); syncToServer(); }
    return changed;
  }).catch(function(){ return false; });
}
/* Link this device to a family: pull the family record for the code
   and merge it with anything already on this device, then keep it
   in sync under that code from now on. Returns a promise<boolean>. */
function linkDevice(rawCode){
  var code=normalizeSyncCode(rawCode);
  if(!syncCodeValid(code)){ toast('That code does not look right — it should be 6 letters, like ABC2DE.'); return Promise.resolve(false); }
  return fetch('/api/progress?code='+encodeURIComponent(code)).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.configured){ toast('Sync is not set up on the server yet — ask a grown-up to finish the Supabase setup first.'); return false; }
    if(!j.data||!j.data.explorers||!j.data.explorers.length){ toast('No family found for that code. Check the code and try again.'); return false; }
    DB=mergeFamilyDB(DB, j.data); DB.syncCode=code; DB.updatedAt=j.updatedAt||new Date().toISOString();
    saveLocal(); syncToServer(); return true;
  }).catch(function(){ toast('Could not reach the server. Check the connection and try again.'); return false; });
}
function save(){ if(!DB)return; DB.updatedAt=new Date().toISOString(); saveLocal(); syncToServer(); }
function load(){
  try{ var raw=localStorage.getItem(LSKEY); if(raw){ DB=JSON.parse(raw); if(!DB.flags)DB.flags=[]; if(!syncCodeValid(DB.syncCode))DB.syncCode=makeSyncCode(); migrateStages(); return; } }catch(e){}
  DB={explorers:[], parentPin:null, dailyLimit:30, activeId:null, syncCode:makeSyncCode(), updatedAt:null, flags:[]};
  save();
}
/* One-time, in-place remap: the Critter Lab now uses the Muse version's
   4 life-cycle stages (was 5). Progress, stars and badges are untouched —
   only the stage index is translated, once, and the data is saved back
   under the same key. */
function migrateStages(){
  if(!DB||DB.stageV===2)return;
  var map={0:0,1:1,2:2,3:2,4:3};
  (DB.explorers||[]).forEach(function(e){
    if(typeof e.critterStage==='number')e.critterStage=(map[e.critterStage]!=null?map[e.critterStage]:0);
    if(e.visitedStages)e.visitedStages=e.visitedStages.map(function(i){ return map[i]!=null?map[i]:0; }).filter(function(v,i,a){ return a.indexOf(v)===i; });
  });

}

  var lk=document.getElementById('doorLink');
  if(lk)lk.onclick=function(){ doorMode='link'; doorCode=[]; render(); };

<script>
/* ============================================================
   WEEKLY THEMES — picking one visibly re-skins Home + accents,
   and the choice is saved per explorer.

/* The same five weekly themes as the Muse version: picking one tints
   the Home terrarium scene and shows the theme's line in its glow colour. */
var THEMES={
 'Frog Pond':{tint:'rgba(46,160,90,.30)',glow:'#7be495',line:'Splash! This week we hop around the Frog Pond.'},
 'Magnet Lab':{tint:'rgba(214,64,84,.28)',glow:'#ff9d8a',line:'Snap! This week we experiment in the Magnet Lab.'},
 'Star Garden':{tint:'rgba(240,178,60,.30)',glow:'#ffd97a',line:'Twinkle! This week we grow ideas in the Star Garden.'},

 'Sky Castle':{tint:'rgba(140,96,220,.30)',glow:'#c9a8ff',line:'Wheee! This week we float up to the Sky Castle.'}
};

function homeHTML(){
  var e=ex(), t=themeOf(e), tname=themeName(e);

/* ---------- Daily fresh-set engine ----------
   poolQuestions: the questions a daily fresh set may draw from —
   the topic's quest questions plus its fresh bank. Warm-up and
   Second Chance banks are deliberately NOT in the pool, so they
   never repeat quest questions. dailyPoolIndices picks 5 for a
   given calendar day, deterministically: the same day always
   gives the same set, and if (rarely) it would match yesterday's
   set exactly, a different mix is pulled instead. Once a set is
   started it is stored in the quest's saved progress, so an
   unfinished quest keeps that exact set across days, untouched. */
function poolQuestions(t){ return t.quest.concat(t.fresh||[]); }
function hashStr(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function seededShuffle(arr, seed){ var a=arr.slice(), s=(seed>>>0)||1; function rnd(){ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; } for(var i=a.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var tmp=a[i]; a[i]=a[j]; a[j]=tmp; } return a; }
function dateKeyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dailyPoolIndices(t, dayStr, salt){
  var n=poolQuestions(t).length, idx=[], take=Math.min(5,n), i;
  for(i=0;i<n;i++)idx.push(i);
  function pull(ds, extra){ return seededShuffle(idx, hashStr(salt+'|'+t.id+'|'+ds+(extra||''))).slice(0,take); }
  var todaySet=pull(dayStr), y=new Date(dayStr+'T12:00:00'); y.setDate(y.getDate()-1);
  var yest=pull(dateKeyOf(y));
  var same=todaySet.every(function(v){ return yest.indexOf(v)>=0; })&&yest.every(function(v){ return todaySet.indexOf(v)>=0; });
  if(same&&n>take){ var alt=pull(dayStr,'|alt'); if(alt.some(function(v){ return todaySet.indexOf(v)<0; }))todaySet=alt; }
  return todaySet;
}
function optsShuffled(q, seed){
  var order=seededShuffle(q.o.map(function(_,i){return i;}), seed);
  return {q:q.q, o:order.map(function(i){return q.o[i];}), a:order.indexOf(q.a), c:q.c, j:q.j};
}
function questListFor(t, c){
  if(c.phase!=='quest')return t.retry;
  if(!c.pool||!c.pool.length)return t.quest;
  var pool=poolQuestions(t);
  return c.pool.map(function(pi){ var q=pool[pi]; if(!q)return null; return c.fresh?optsShuffled(q, hashStr(t.id+'#'+pi)):q; }).filter(Boolean);
}

function startQuestFlow(topicId){
  var e=ex();
  if(e.progress[topicId]){ cur=loadProgress(topicId); go('quiz'); }
  else { warm={topicId:topicId, order:shuffle(topicById(topicId).warm.map(function(_,i){return i;})), idx:0, correct:0, left:60, timer:null, picked:null, answered:false}; go('warmup'); }
}
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function loadProgress(topicId){
  var p=ex().progress[topicId];
  /* A saved, unfinished quest resumes with the exact set it started
     with (p.pool), whatever the date is now — it is never re-pulled.
     Progress saved by older builds has no pool: it means the
     original quest set, in order. */
  return {topicId:topicId, phase:'quest', idx:p.idx, score:p.score, wrong:p.wrong||[], picked:(p.picked!=null?p.picked:null), answered:!!p.answered, pool:(p.pool&&p.pool.length?p.pool:[0,1,2,3,4]), fresh:!!p.fresh};
}

/* Rounds are generated from a seed. A game still in progress keeps
   the seed it started with (seed 0 = the original rounds, for games
   saved by older builds), so its questions never change mid-game.
   A finished game gets a fresh seed every morning, so its rounds
   are new each day — Word Garden also draws from the fresh bank. */
function genRound(gameId, idx, seed){
  seed=seed||0;
  if(gameId==='word'){
    var pool=TOPICS[0].quest.concat(TOPICS[0].fresh||[], TOPICS[1].quest, TOPICS[1].fresh||[]);
    if(!seed)return pool[idx%pool.length];
    var order=seededShuffle(pool.map(function(_,i){return i;}), hashStr('word|'+seed));
    return optsShuffled(pool[order[idx%order.length]], hashStr('wo|'+seed+'|'+idx));
  }
  if(gameId==='sort'){ var sets=[[ '🍎 Apple',['🍎','🍌','🍇','🐶'] ],[ '🚗 Car',['🚗','🚌','🚲','🍕'] ],[ '🐸 Frog',['🐸','🐢','🦁','🚀'] ],[ '📚 Book',['📚','✏️','🖍️','🍔'] ],[ '🌧 Rainy',['🌧','⛈','☔','🏖'] ],[ '🐟 Fish',['🐟','🐙','🦀','🍩'] ]];
    if(!seed){ var s0=sets[idx%sets.length]; return {q:'Which one does NOT belong?', o:s0[1], a:3, c:'', j:''}; }
    var s=sets[(idx+seed)%sets.length]; return optsShuffled({q:'Which one does NOT belong?', o:s[1], a:3, c:'', j:''}, hashStr('so|'+seed+'|'+idx)); }
  var a, b;
  if(!seed){ a=3+((idx*7)%18); b=2+((idx*5)%9); }
  else { var hs=hashStr('num|'+seed+'|'+idx); a=3+(hs%18); b=2+((Math.floor(hs/32))%9); }
  var isMul=idx%2===0;
  var ans=isMul?a*b:a+b, opts=shuffle([ans,ans+1,ans-1,ans+2].map(function(x){return String(x);}));
  return {q:(isMul?(a+' × '+b+' = ?'):(a+' + '+b+' = ?')), o:opts, a:opts.indexOf(String(ans)), c:'', j:''};
}
function startGame(id){

  var seed;
  if(p&&!doneP){ seed=p.seed||0; /* unfinished game: keep its rounds exactly as they were */ }
  else { var rec=e.playFresh[id]; if(!rec||rec.day!==todayKey()){ rec={day:todayKey(), seed:hashStr('play|'+id+'|'+todayKey()+'|'+e.id)}; e.playFresh[id]=rec; save(); } seed=rec.seed; }
  if(id==='memory'){ gState={id:id, deck:shuffle(['🐸','🐸','🦦','🦦','🍓','🍓','⭐','⭐','🚀','🚀','🦋','🦋']), open:[], matched:(p?p.matched:[]), lock:false, moves:(p?p.moves:0), won:false}; }

function bindAsk(){

  var back=document.getElementById('askBack'); if(back)back.onclick=function(){ activeThread=null; render(); };

  document.querySelectorAll('[data-fav]').forEach(function(b){ b.onclick=function(){ var th=e.threads.find(function(t){return t.id===activeThread;}); var txt=th.msgs[parseInt(b.getAttribute('data-fav'),10)].text; if(e.favAnswers.indexOf(txt)<0)e.favAnswers.push(txt); save(); toast('Saved to your Golden Bookmark! 🔖'); }; });

    var pipMsg=th.msgs[mi]; var kidMsg=null; for(var i=mi-1;i>=0;i--){ if(th.msgs[i].who==='kid'){ kidMsg=th.msgs[i]; break; } }
    var correction=window.prompt('What should Pip have said instead? (Leave blank if you just want to flag it — Pip will still learn from it.)','')||'';
    var sk=skillForQuestionClient(kidMsg?kidMsg.text:'');
    recordFlag(kidMsg?kidMsg.text:'(flagged answer)', pipMsg.text, correction, sk?sk.id:(pipMsg.skillId||''), !!pipMsg.live);
  }; });
  var send=document.getElementById('askSend');

    var inp=document.getElementById('askInput'); var v=inp.value.trim(); if(!v)return;

    var hist=th.msgs.slice(-8).map(function(m){return {role:m.who,text:m.text};});
    th.msgs.push({who:'pip', text:'Pip is thinking… 🦦'});
    save(); render();
    var log=document.getElementById('chatlog'); if(log)log.scrollTop=log.scrollHeight;
    askPipLive(v, hist, e.name).then(function(live){
      var th2=e.threads.find(function(t){return t.id===activeThread;});
      if(!th2)return;
      var last=th2.msgs[th2.msgs.length-1];
      if(last&&last.who==='pip'&&last.text.indexOf('Pip is thinking')===0){
        if(live){ last.text=live.reply; last.skill=live.skillName||''; last.skillId=live.skillId||''; last.agent=live.agentName||''; last.live=true; }
        else { last.text=pipReply(v); var sk2=skillForQuestionClient(v); last.skill=sk2?sk2.name:''; last.skillId=sk2?sk2.id:''; last.live=false; }
      }
      save(); render();
      var log2=document.getElementById('chatlog'); if(log2)log2.scrollTop=log2.scrollHeight;
    });
  }
  if(send)send.onclick=doSend;
  var inp=document.getElementById('askInput'); if(inp)inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter')doSend(); });
  var log=document.getElementById('chatlog'); if(log)log.scrollTop=log.scrollHeight;
}

  document.querySelectorAll('[data-plan]').forEach(function(b){ b.onclick=function(){ var i=parseInt(b.getAttribute('data-plan'),10); e.planner[i].d=!e.planner[i].d; if(e.planner[i].d)sndCorrect(); else sndPop(); save(); render(); }; });
  document.querySelectorAll('[data-pldel]').forEach(function(b){ b.onclick=function(){ var i=parseInt(b.getAttribute('data-pldel'),10); e.planner.splice(i,1); save(); render(); }; });
  document.getElementById('plAdd').onclick=function(){
    var v=document.getElementById('plNew').value.trim(); if(!v){ toast('Type a plan first!'); return; }
    e.planner.push({t:v,d:false}); save(); sndPop(); toast('Plan added! You have got this. 📋'); render();
  };
  var pln=document.getElementById('plNew'); if(pln)pln.addEventListener('keydown',function(ev){ if(ev.key==='Enter')document.getElementById('plAdd').click(); });
}

  var days=[]; for(var i=6;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i); var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); days.push({label:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()], v:sel.daily[k]||0}); }

  var stuckNames=(sel.stuck||[]).map(function(id){ var t=topicById(id); return t?t.name:id; });
  var tmrD=new Date(); tmrD.setDate(tmrD.getDate()+1); var tPlan=studyPlanFor(tmrD.getDay()); var tEv=schoolEventFor(tmrD);
  var datD=new Date(); datD.setDate(datD.getDate()+2); var datEv=schoolEventFor(datD);
  var plan=(stuckNames.length? 'Weak spot (stuck twice): <b>'+esc(stuckNames[0])+'</b>. Tomorrow’s study block becomes a gentle one for it — start with a <b>3-minute Play warm-up game</b> on that topic, not a full quiz, then one short quest together if she is up for it.' : 'No weak spots right now (a topic only counts after she is stuck on it twice). Tomorrow, follow the timetable and let '+esc(sel.name)+' pick the quest within it — choice keeps motivation high.')
   +' Tomorrow is <b>'+esc(fmtDate(tmrD))+'</b>: <b>'+esc(tPlan.label)+'</b> · '+esc(tPlan.study)+'.'
   +(tEv?' School note for tomorrow: <b>'+esc(tEv.name)+'</b> — '+esc(tEv.note):'')
   +(datEv&&datEv.kind==='due'?' Heads-up: <b>'+esc(datEv.name)+'</b> lands the day after tomorrow, so tomorrow Pip nudges a short revision game — not a full quiz.':'')
   +(tPlan.rest?' It is dance & art day — Pip will not set any extra study.':'');
  var doneList=Object.keys(sel.completed).map(function(id){ var t=topicById(id); return t.icon+' '+t.name+' ('+sel.completed[id]+'/5)'; });
  return '<h2 style="margin:0;font-size:1.55rem">🌙 Grown-ups — summary &amp; dashboard</h2><p class="muted" style="font-weight:700;margin:5px 0 14px">The evening summary and the full dashboard in one place — quests, screen time, Pip’s plan for tomorrow, and explorer controls. Everything here is from the linked family, refreshed from the server when you open this page.</p>'
   +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'+DB.explorers.map(function(x){ return '<button class="btn '+(x.id===sel.id?'':'ghost')+'" data-psel="'+x.id+'">'+esc(x.name)+' · ⭐ '+x.stars+'</button>'; }).join('')+'<span style="flex:1"></span><button class="btn ghost" id="pLock">🔒 Lock</button></div>'
   +'<div class="card" style="margin-bottom:14px"><h3 style="margin-top:0">🔗 Family sync — resume on any device</h3>'
   +'<p style="font-weight:700;margin:6px 0">Family sync code: <b style="font-size:1.4rem;letter-spacing:3px">'+esc(DB.syncCode||'—')+'</b></p>'
   +'<p class="small muted" style="font-weight:700">On any other device, open this app, tap “Link this device with a family code” at the Grand Door, and type this code. That device pulls down this family’s progress and keeps in sync. Keep the code in the family — anyone with it can see the progress.</p>'
   +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="syncCopy">📋 Copy code</button><button class="btn ghost" id="syncRefresh">↻ Refresh from server now</button><span class="small muted" id="syncStatus" style="align-self:center;font-weight:700"></span></div></div>'
   +'<div class="card" style="margin-bottom:14px"><h3 style="margin-top:0">🧪 Every flag becomes a test</h3>'
   +'<p style="font-weight:700;margin:6px 0">'+((DB.flags||[]).length?('Flagged answers so far: <b>'+DB.flags.length+'</b> — each one made a regression test, so tomorrow’s Pip beats today’s.'):'No flags yet. When anyone taps 🚩 Flag this on a Pip answer, the flag and its test appear here.')+'</p>'
   +((DB.flags||[]).slice(0,3).map(function(f){ return '<div class="feedback no" style="font-weight:700">“'+esc(f.question)+'” — Pip said “'+esc(String(f.pipAnswer).slice(0,60))+'” · Method: '+esc(f.skillId||'—')+' · '+esc(f.status)+'</div>'; }).join(''))
   +'<p class="small muted" style="font-weight:700">Marks and rewards are plain code rules (lib/rules.js) — Pip explains, code decides. Skills pack: '+esc(SKILL_PACK.version)+' · 19 specialist agents (15 live, 4 placeholders: Muse Image, SAM 3.1, Muse Voice Transcribe, Muse Spark Open).</p></div>'
   +'<div class="grid c2"><div class="card"><h3>🌙 Evening summary — '+esc(sel.name)+'</h3><p style="font-weight:700">Today: <b>'+todayMin+' min</b> in the app · <b>'+doneList.length+' of 14 quests</b> finished overall · <b>⭐ '+sel.stars+' stars</b> · badges: <b>'+sel.badges.length+'</b></p>'
   +'<p style="font-weight:700">📅 Today’s timetable: <b>'+esc(studyPlanFor(new Date().getDay()).label)+'</b> · '+esc(studyPlanFor(new Date().getDay()).study)+(schoolEventFor(new Date())?' · '+esc(schoolEventFor(new Date()).name):'')+' — today’s quest in the app was picked from these subjects.</p>'
   +'<p style="font-weight:700">🌈 Mood check-in today: <b>'+(sel.mood&&sel.mood[tk]?esc(sel.mood[tk]):'not tapped yet — the mood picker sits on Home, in the “My week” card')+'</b></p>'
   +'<p style="font-weight:700">✏️ HCL spelling: '+esc(hclStepFor(new Date().getDay(), sel).title)+'. Missed words kept for the Fri/Sun redo: <b>'+((sel.hclMissed&&sel.hclMissed.length)?esc(sel.hclMissed.join('、')):'none right now')+'</b></p>'
   +(doneList.length?'<p class="small" style="font-weight:700">Quests finished: '+doneList.map(esc).join(' · ')+'</p>':'<p class="small muted">No quests finished yet.</p>')
   +'<p style="font-weight:700">🌅 Daily refresh: every finished quest got a fresh set of questions today, and finished Play games got fresh rounds — all '+TOPICS.length+' topics have a fresh bank, so coverage stays even across English, Maths, Science and Chinese. Quests and games still in progress were left exactly as they were, ready to resume.</p>'
   +'<h4>👀 Worth a look</h4>'+(stuckNames.length?stuckNames.map(function(n){ return '<div class="feedback no" style="font-weight:700">“'+esc(n)+'” needed a few tries. What may help: a short game first, then the quest together — keep it light and early in the day.</div>'; }).join(''):'<p style="font-weight:700">Nothing flagged — steady, happy progress. 🎉</p>')
   +'<h4>🗓 Pip’s plan for tomorrow</h4><p style="font-weight:700">'+plan+'</p></div>'
   +'<div class="card"><h3>⏱ Screen time</h3><p style="font-weight:800;font-size:1.3rem">'+todayMin+' min today <span class="small muted">· limit '+DB.dailyLimit+' min/day</span></p>'
   +(todayMin>DB.dailyLimit?'<div class="feedback no">Over the daily limit today by '+(todayMin-DB.dailyLimit)+' min.</div>':'<p class="small muted" style="font-weight:700">Within today’s limit.</p>')
   +'<svg viewBox="0 0 330 122" style="width:100%;max-width:330px" role="img" aria-label="Last 7 days screen time chart"><line x1="4" y1="'+(100-Math.round(DB.dailyLimit/maxV*90))+'" x2="326" y2="'+(100-Math.round(DB.dailyLimit/maxV*90))+'" stroke="#ffc94d" stroke-width="2" stroke-dasharray="5 4"/>'+bars+'</svg><p class="small muted">Dashed line = daily limit. This counts time in the app across linked devices.</p>'
   +'<label class="flabel">Daily limit (minutes)</label><div style="display:flex;gap:8px"><input class="field" id="limitIn" type="number" min="5" max="240" value="'+DB.dailyLimit+'"><button class="btn" id="limitSave">Save</button></div>'
   +'<h4 style="margin-top:18px">⚖️ Today’s balance</h4><p style="font-weight:700">Learning quests finished: '+doneList.length+' · Treasures unlocked: '+sel.treasures.length+' · Ask Pip chats: '+sel.threads.length+'</p>'
   +'<h4>🌈 Weekend together idea</h4><p style="font-weight:700">Try a riverside walk or a hawker-centre breakfast together, then let '+esc(sel.name)+' teach you one thing Pip taught her this week — kids love being the teacher!</p></div></div>'
   +'<div class="card" style="margin-top:16px"><h3>🧑‍🤝‍🧑 Explorers on this device</h3>'
   + DB.explorers.map(function(x){ return '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:2px solid var(--line)"><span style="font-size:1.5rem">'+x.face+'</span><b>'+esc(x.name)+'</b><span class="small muted">⭐ '+x.stars+' · '+Object.keys(x.completed).length+' quests</span><span style="flex:1"></span><button class="btn ghost" data-reset="'+x.id+'">🔑 Reset picture code</button><button class="btn coral" data-remove="'+x.id+'">Remove explorer</button></div>'; }).join('')
   +'<div id="resetArea"></div>'
   +'<h4 style="margin-top:18px">Parent PIN</h4><button class="btn ghost" id="pinChange">Change PIN</button> <span id="pinChangeArea"></span>'
   +'<p class="small muted" style="margin-top:14px">This page shows the linked family’s progress, refreshed from the server. There is no location tracking and no camera monitoring in this app.</p></div>';
}
var parentSel=null;
function bindParent(){
  if(!DB.parentPin){
    document.getElementById('pinSet').onclick=function(){ var a=document.getElementById('pinNew').value.trim(), b=document.getElementById('pinNew2').value.trim();
      if(!/^\d{4}$/.test(a)){ toast('PIN must be exactly 4 digits.'); return; } if(a!==b){ toast('The two PINs don’t match.'); return; }
      DB.parentPin=a; parentUnlocked=true; save(); render(); };
    return;
  }
  if(!parentUnlocked){
    document.querySelectorAll('[data-key]').forEach(function(b){ b.onclick=function(){ var k=b.getAttribute('data-key');
      if(k==='⌫')pinBuf=pinBuf.slice(0,-1); else if(pinBuf.length<4)pinBuf+=k;
      if(pinBuf.length===4){ if(pinBuf===DB.parentPin){ parentUnlocked=true; pinBuf=''; render(); return; } toast('Wrong PIN — try again.'); pinBuf=''; }
      render();
    }; });
    return;
  }
  document.querySelectorAll('[data-psel]').forEach(function(b){ b.onclick=function(){ parentSel=b.getAttribute('data-psel'); render(); }; });
  document.getElementById('pLock').onclick=function(){ parentUnlocked=false; go('home'); };
  var cp=document.getElementById('syncCopy'); if(cp)cp.onclick=function(){
    var code=DB.syncCode||'';
    function done(){ toast('Family sync code copied: '+code); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(done,function(){ toast('Code: '+code+' — copy it by hand.'); }); }
    else toast('Code: '+code+' — copy it by hand.');
  };
  var rf=document.getElementById('syncRefresh'); if(rf)rf.onclick=function(){
    var st=document.getElementById('syncStatus'); if(st)st.textContent='Refreshing…';
    syncFromServer({}).then(function(changed){ toast(changed?'Progress refreshed from the server.':'Already up to date with the server.'); render(); });
  };
  document.getElementById('limitSave').onclick=function(){ var v=parseInt(document.getElementById('limitIn').value,10); if(v>=5&&v<=240){ DB.dailyLimit=v; save(); toast('Daily limit saved.'); render(); } };
  document.querySelectorAll('[data-reset]').forEach(function(b){ b.onclick=function(){
    var target=DB.explorers.find(function(x){return x.id===b.getAttribute('data-reset');}); var picks=[];
    var area=document.getElementById('resetArea');
    area.innerHTML='<div class="card" style="margin-top:12px"><h4>New picture code for '+esc(target.name)+'</h4><p class="small muted" style="font-weight:700">Tap 3 pictures in order — this becomes the new code.</p><div class="codebubbles" id="rsBubbles"></div><div class="picgrid">'+PIC_CHOICES.map(function(p){ return '<button class="picbtn" data-rpic="'+p+'">'+p+'</button>'; }).join('')+'</div></div>';
    renderBubbles(document.getElementById('rsBubbles'), picks);
    document.querySelectorAll('[data-rpic]').forEach(function(pb){ pb.onclick=function(){ if(picks.length<3)picks.push(pb.getAttribute('data-rpic')); renderBubbles(document.getElementById('rsBubbles'), picks); if(picks.length===3){ target.code=picks.slice(); save(); toast('Picture code reset for '+target.name+'.'); area.innerHTML=''; } }; });
  }; });
  document.querySelectorAll('[data-remove]').forEach(function(b){ b.onclick=function(){
    var target=DB.explorers.find(function(x){return x.id===b.getAttribute('data-remove');});
    openModal('<h3 style="margin-top:0">Remove '+esc(target.name)+'?</h3><p style="font-weight:700">This deletes this explorer and all their progress <b>everywhere, on every linked device</b>. This cannot be undone.</p><div style="display:flex;gap:10px"><button class="btn coral" id="rmYes">Yes, remove</button><button class="btn ghost" onclick="closeModal()">Keep explorer</button></div>');
    document.getElementById('rmYes').onclick=function(){ DB.explorers=DB.explorers.filter(function(x){return x.id!==target.id;}); if(DB.activeId===target.id)DB.activeId=DB.explorers.length?DB.explorers[0].id:null; save(); closeModal(); if(!DB.explorers.length){ parentUnlocked=false; go('door'); } else render(); };
  }; });
  document.getElementById('pinChange').onclick=function(){
    document.getElementById('pinChangeArea').innerHTML='<span style="display:inline-flex;gap:6px;margin-left:8px"><input class="field" id="pinCh" type="password" inputmode="numeric" maxlength="4" placeholder="New 4-digit PIN" style="width:170px"><button class="btn" id="pinChSave">Save PIN</button></span>';
    document.getElementById('pinChSave').onclick=function(){ var v=document.getElementById('pinCh').value.trim(); if(!/^\d{4}$/.test(v)){ toast('PIN must be exactly 4 digits.'); return; } DB.parentPin=v; save(); toast('Parent PIN changed.'); render(); };
  };
}

/* ============================================================ BOOT */
load();
ensureSyncCode();
/* First load: pull the family record before the first render when
   this device is already linked, so the parent page (and Home) show
   the newest progress, not a stale local copy. */
if(typeof syncFromServer==='function')syncFromServer({}).then(function(changed){ if(changed)render(); });
applyTheme();
setInterval(function(){ if(ex()&&document.visibilityState==='visible'){ addMinutes(1); save(); } },60000);
render();
</script>
