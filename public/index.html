function bindCritter(){
  var e=ex(); if(!e.visitedStages)e.visitedStages=[]; if(!e.discoveredCritters)e.discoveredCritters=[];
  document.querySelectorAll('[data-stage]').forEach(function(b){ b.onclick=function(){ var i=parseInt(b.getAttribute('data-stage'),10); critterView=i; /* Looking at a stage never rewinds growth: the frog only ever grows forward, to the furthest stage explored. */ if(i>e.critterStage)e.critterStage=i; if(e.visitedStages.indexOf(i)<0)e.visitedStages.push(i); if(e.visitedStages.length>=4)awardBadge('critter','🐸 Critter Friend'); save(); sndPop(); render(); }; });
  document.querySelectorAll('[data-critter]').forEach(function(b){ b.onclick=function(){ var id=b.getAttribute('data-critter'); var c=CRITTERS.find(function(x){return x.id===id;}); selCritter=id;
    if(e.discoveredCritters.indexOf(id)<0){ e.discoveredCritters.push(id); sndCorrect(); toast('Discovered: '+c.name+'! '+c.e);
      if(e.discoveredCritters.length>=5)awardBadge('spotter','🔍 Critter Spotter');
      if(e.discoveredCritters.length>=12)awardBadge('naturalist','🌿 Young Naturalist');
      if(e.discoveredCritters.length>=CRITTERS.length)confettiStars();
    } else sndPop();

    /* The detail card now sits right under this critter's category, so bring it into view instead of making the child scroll up to find it. */
    var cd=document.getElementById('critterDetail'); if(cd)cd.scrollIntoView({behavior:'smooth',block:'nearest'}); }; });
  var cs=document.getElementById('critSave'); if(cs)cs.onclick=function(){ var v=document.getElementById('critName').value.trim(); if(v){ e.critterName=v; e.critterNameAt=new Date().toISOString(); save(); toast('Your critter is now called '+v+'! 🐸'); render(); } };
  /* Record one care: the SAME rules as the old one-tap buttons —
     1 star, 4-hour cooldown, all three in one day grows the frog
     one stage (once a day, never past Adult Frog). Only the way the
     child gets here changed: each care is now a little activity
     (pick a food, rub the dirt away, chase the ball) that calls
     this when it finishes. */
  function recordCare(id,msg){
    var a=CARE_ACTIONS.find(function(x){return x.id===id;}); if(!a)return;
    /* Resolve the explorer fresh: a sync merge replaces the DB
       object, and a care written through a stale copy would be lost. */
    var eNow=ex(); if(!eNow||!careReady(eNow.care,id,Date.now()))return;
    if(!eNow.care)eNow.care={};
    eNow.care[id]={at:new Date().toISOString(), day:todayKey()};
    earnStars(eNow,1); careMsg=msg||a.msg; careFx={a:id, k:Date.now()};
    setTimeout(function(){ careFx=null; }, 1700);
    pondMode=null; dirtLeft=null; if(playTimer){ clearInterval(playTimer); playTimer=null; } stopPlayChase();
    /* All three cares in one day: the frog grows one stage, once a day. */
    if(careAllToday(eNow.care,todayKey())&&eNow.careGrewDay!==todayKey()&&eNow.critterStage<3){ eNow.critterStage++; eNow.careGrewDay=todayKey(); careMsg=(msg||a.msg)+' And look — '+eNow.critterName+' grew a little! 🌱'; sndFanfare(); } else sndCorrect();
    save(); render();
  }
  function placeFrog(){ var w=document.getElementById('frogWrap'); if(w){ w.style.left=frogPos.x+'%'; w.style.top=frogPos.y+'%'; } }
  function hopToward(x,y,step){ var s=(step==null?0.35:step); frogPos={x:frogPos.x+(x-frogPos.x)*s, y:frogPos.y+(y-frogPos.y)*s}; placeFrog(); }
  /* Tap the frog: replay the happy reaction (hop + floating emoji +
     speech bubble) even while every care is on cooldown. */
  function frogTap(){
    var eNow=ex(); if(!eNow)return;
    var line=nextFrogFact();
    careFx={a:'play', k:Date.now()};
    setTimeout(function(){ careFx=null; }, 1700);
    sndPop(); render();
    var b=document.getElementById('frogBubble'); if(b){ b.textContent='💬 '+(eNow.critterName||'Frog')+': '+line; b.style.display='block'; }
    if(frogBubbleTimer)clearTimeout(frogBubbleTimer);
    frogBubbleTimer=setTimeout(function(){ var b2=document.getElementById('frogBubble'); if(b2)b2.style.display='none'; },2600);
  }
  function startCareActivity(id){
    var eNow=ex(); if(!eNow||!careReady(eNow.care,id,Date.now()))return;
    pondMode=id; if(id==='clean')dirtLeft=5;
    sndPop(); render();
  }
  function spawnDirt(){
    var d=document.getElementById('pondDirt'); if(!d)return;
    d.innerHTML=''; if(dirtLeft==null)dirtLeft=5;
    for(var i=0;i<dirtLeft;i++){
      var s=document.createElement('button'); s.type='button'; s.className='dirt-spot';
      s.style.left=(8+Math.random()*78)+'%'; s.style.top=(10+Math.random()*68)+'%';

      var rub=function(ev){ if(ev)ev.preventDefault(); var el=ev.currentTarget; if(!el||!el.parentNode)return; el.parentNode.removeChild(el); dirtLeft--; sndPop(); if(dirtLeft<=0){ dirtLeft=null; recordCare('clean'); } };
      s.addEventListener('pointerdown',rub);
      s.addEventListener('pointerover',function(ev){ if(ev.buttons)rub(ev); });
      d.appendChild(s);
    }
  }
  function startPlayMode(){
    var pond=document.getElementById('pond'); if(!pond)return;
    var toy=document.getElementById('pondToy'); if(!toy)return;
    toy.style.display='block'; pond.style.touchAction='none';
    /* The 8-second clock survives a re-render mid-game: only start
       it when no clock is already running. */
    if(!playTimer){
      var remain=8; var cd=document.getElementById('playCount'); if(cd)cd.textContent='8s to go!';
      playTimer=setInterval(function(){
        remain--;
        var c2=document.getElementById('playCount'); if(c2)c2.textContent=remain>0?remain+'s to go!':'';
        if(remain<=0){ clearInterval(playTimer); playTimer=null; if(pondMode==='play')recordCare('play'); }
      },1000);
    }
    /* The chase must survive a re-render mid-game: the pond element
       is rebuilt by every render, so a handler bound only to it (the
       old pond.onpointermove) died whenever the page re-rendered —
       the ball stayed where it was and the frog never chased it
       (seen live 2026-11-07). One document-level listener instead:
       it re-fetches the live pond and toy on every move, so it keeps
       working across renders, overlays and pointer capture. One
       listener at most: re-binding removes the previous one first,
       and it is removed when play ends (stopPlayChase). */
    if(playPointerHandler){ document.removeEventListener('pointermove',playPointerHandler); playPointerHandler=null; }

      var t=document.getElementById('pondToy'); if(!t)return;
      if(t.style.display==='none')t.style.display='block';
      var r=p.getBoundingClientRect();
      var x=Math.max(4,Math.min(92,(ev.clientX-r.left)/r.width*100));
      var y=Math.max(8,Math.min(88,(ev.clientY-r.top)/r.height*100));

  document.querySelectorAll('[data-care]').forEach(function(b){ b.onclick=function(){ startCareActivity(b.getAttribute('data-care')); }; });
  document.querySelectorAll('[data-food]').forEach(function(b){ b.onclick=function(){ var f=FOODS.find(function(x){return x.name===b.getAttribute('data-food');}); if(!f)return; recordCare('feed','Yum! '+ex().critterName+' gobbled the '+f.e+' '+f.name+'! 😋'); }; });
  var cc=document.getElementById('careCancel'); if(cc)cc.onclick=function(){ pondMode=null; dirtLeft=null; if(playTimer){ clearInterval(playTimer); playTimer=null; } stopPlayChase(); render(); };
  /* The live frog: it wanders the pond on its own, can be dragged
     directly, and a tap (a press without dragging) says hello.
     The drag is handled at DOCUMENT level (like the play chase):
     render() rebuilds the pond, so handlers bound to #frogWrap die
     whenever the page re-renders mid-drag — a re-render from the
     30s auto-pull or another tab's save releases pointer capture
     and the frog freezes exactly where it was (seen live
     2026-11-07: the frog stayed put through a 4.3s held drag,
     then wandered off once the drag pause expired). The document
     listener re-fetches the live pond on every move, so the drag
     survives any re-render, and it needs no pointer capture at
     all. While dragging, the pond gets a 'dragging' class that
     turns the frog's 1.3s wander transition off — otherwise every
     move restarts that ease-in-out transition and the frog barely
     creeps after the pointer instead of tracking it. One listener
     of each kind at most: re-binding removes the previous one. */
  var wrap=document.getElementById('frogWrap');
  if(wrap){
    wrap.addEventListener('pointerdown',function(ev){ frogDragging=true; frogDragMoved=false; frogDownX=ev.clientX; frogDownY=ev.clientY; frogPausedUntil=Date.now()+3000; var p0=document.getElementById('pond'); if(p0)p0.classList.add('dragging'); });
    /* Hold still while aimed at: the frog wanders to a new spot
       every 3.8s, and a press aimed at the smallest stage
       (frogspawn, 150px) can land on empty pond after it glides
       away — seen live 2026-11-07, two frogspawn drags in a row.
       Hovering pauses the wander, so the frog is where the child
       aimed when they press. */
    wrap.addEventListener('pointerenter',function(){ frogHover=true; });
    wrap.addEventListener('pointerleave',function(){ frogHover=false; });
  }
  if(frogDragHandler){ document.removeEventListener('pointermove',frogDragHandler); frogDragHandler=null; }
  frogDragHandler=function(ev){
    if(!frogDragging)return;
    if(Math.abs(ev.clientX-frogDownX)+Math.abs(ev.clientY-frogDownY)>8)frogDragMoved=true;
    if(!frogDragMoved)return;
    var pond=document.getElementById('pond'); if(!pond)return;
    if(!pond.classList.contains('dragging'))pond.classList.add('dragging');
    var r=pond.getBoundingClientRect();
    frogPos={x:Math.max(4,Math.min(90,(ev.clientX-r.left)/r.width*100)), y:Math.max(10,Math.min(84,(ev.clientY-r.top)/r.height*100))};
    placeFrog();
  };
  document.addEventListener('pointermove',frogDragHandler);
  if(frogDragUpHandler){ document.removeEventListener('pointerup',frogDragUpHandler); document.removeEventListener('pointercancel',frogDragUpHandler); frogDragUpHandler=null; }
  frogDragUpHandler=function(){
    if(!frogDragging)return;

    var p=document.getElementById('pond'); if(p)p.classList.remove('dragging');
    if(!frogDragMoved)frogTap();
  };
  document.addEventListener('pointerup',frogDragUpHandler);
  document.addEventListener('pointercancel',frogDragUpHandler);
  if(frogTimer)clearInterval(frogTimer);
  frogTimer=setInterval(function(){
    if(route!=='critter'||pondMode==='play'||frogDragging||frogHover||Date.now()<frogPausedUntil)return;

  },3800);
  if(pondMode==='clean')spawnDirt();
  if(pondMode==='play')startPlayMode();
}

  };
  var rf=document.getElementById('syncRefresh'); if(rf)rf.onclick=function(){
    var st=document.getElementById('syncStatus'); if(st)st.textContent='Refreshing…';
    syncFromServer({}).then(function(changed){ toast(changed?'Progress refreshed from the server.':'Already up to date with the server.'); render(); });
  };
  document.getElementById('limitSave').onclick=function(){ var v=parseInt(document.getElementById('limitIn').value,10); if(v>=5&&v<=240){ DB.dailyLimit=v; save(); toast('Daily limit saved.'); render(); } };
  document.getElementById('playLimitSave').onclick=function(){ var v=parseInt(document.getElementById('playLimitIn').value,10); if(v>=5&&v<=240){ DB.playLimit=v; save(); toast('Play limit saved.'); render(); } };
  document.querySelectorAll('[data-reset]').forEach(function(b){ b.onclick=function(){
    var target=DB.explorers.find(function(x){return x.id===b.getAttribute('data-reset');}); var picks=[];
    var area=document.getElementById('resetArea');
    area.innerHTML='<div class="card" style="margin-top:12px"><h4>New picture code for '+esc(target.name)+'</h4><p class="small muted" style="font-weight:700">Tap 3 pictures in order — this becomes the new code.</p><div class="codebubbles" id="rsBubbles"></div><div class="picgrid">'+PIC_CHOICES.map(function(p){ return '<button class="picbtn" data-rpic="'+p+'">'+p+'</button>'; }).join('')+'</div></div>';
    renderBubbles(document.getElementById('rsBubbles'), picks);
    document.querySelectorAll('[data-rpic]').forEach(function(pb){ pb.onclick=function(){ if(picks.length<3)picks.push(pb.getAttribute('data-rpic')); renderBubbles(document.getElementById('rsBubbles'), picks); if(picks.length===3){ target.code=picks.slice(); target.codeAt=new Date().toISOString(); save(); toast('Picture code reset for '+target.name+'.'); area.innerHTML=''; } }; });
  }; });
  document.querySelectorAll('[data-plvl]').forEach(function(b){ b.onclick=function(){ var t=DB.explorers.find(function(x){return x.id===parentSel;})||ex(); if(!t)return; t.level=b.getAttribute('data-plvl'); t.levelAt=Date.now(); save(); toast('Primary level set to '+t.level+' for '+t.name+'.'); render(); }; });
  document.querySelectorAll('[data-remove]').forEach(function(b){ b.onclick=function(){
    var target=DB.explorers.find(function(x){return x.id===b.getAttribute('data-remove');});
    openModal('<h3 style="margin-top:0">Remove '+esc(target.name)+'?</h3><p style="font-weight:700">This deletes this explorer and all their progress <b>everywhere, on every linked device</b>. This cannot be undone.</p><div style="display:flex;gap:10px"><button class="btn coral" id="rmYes">Yes, remove</button><button class="btn ghost" onclick="closeModal()">Keep explorer</button></div>');
    document.getElementById('rmYes').onclick=function(){ DB.explorers=DB.explorers.filter(function(x){return x.id!==target.id;}); if(DB.activeId===target.id)DB.activeId=DB.explorers.length?DB.explorers[0].id:null; save(); closeModal(); if(!DB.explorers.length){ parentUnlocked=false; go('door'); } else render(); };
  }; });
  document.getElementById('pinChange').onclick=function(){
    document.getElementById('pinChangeArea').innerHTML='<span style="display:inline-flex;gap:6px;margin-left:8px"><input class="field" id="pinCh" type="password" inputmode="numeric" maxlength="4" placeholder="New 4-digit PIN" style="width:170px"><button class="btn" id="pinChSave">Save PIN</button></span>';
    document.getElementById('pinChSave').onclick=function(){ var v=document.getElementById('pinCh').value.trim(); if(!/^\d{4}$/.test(v)){ toast('PIN must be exactly 4 digits.'); return; } DB.parentPin=v; save(); toast('Parent PIN changed.'); render(); };
  };
  /* Friends (leaderboard-only): fill the Friend requests card for
     the selected explorer. A friend joins the child's leaderboard
     only after the parent accepts here. */
  (function(){ var sel=DB.explorers.find(function(x){return x.id===parentSel;})||ex(); if(sel)renderParentFriends(sel); })();
}

/* ============================================================ BOOT */
load();
ensureSyncCode();
refreshFriendBadge();
/* First load: pull the family record before the first render when
   this device is already linked, so the parent page (and Home) show
   the newest progress, not a stale local copy. */
if(typeof syncFromServer==='function')syncFromServer({}).then(function(changed){ if(changed)render(); });
applyTheme();
setInterval(function(){ if(ex()&&document.visibilityState==='visible'){ addMinutes(1); if(route==='play'||route==='game'){ var pe=ex(); if(!pe.playDaily)pe.playDaily={}; pe.playDaily[todayKey()]=(pe.playDaily[todayKey()]||0)+1; } save(); } },60000);
/* Live sync: pull every 30s while the tab is visible, and again
   whenever the tab comes back into view. autoPull() only re-renders
   when safe (not mid-quiz/warm-up/game, no modal open). The 60s
   screen-time save above now goes through pull-then-upload
   (save -> syncToServer -> uploadAfterPull), so it can no longer
   overwrite newer server progress with a stale snapshot. */
setInterval(autoPull,30000);
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible')autoPull(); });
/* Cross-tab convergence (see mergeStoredIntoDB): when another tab
   writes this device's localStorage, merge its explorers into this
   tab's DB and re-render when safe — so a new explorer shows up in
   every open tab without waiting for the 30s pull. */
window.addEventListener('storage',function(ev){
  if(!ev||ev.key!==LSKEY||!DB)return;
  if(mergeStoredIntoDB()){ saveLocal(); if(safeToRender())render(); }
});
render();
</script>
