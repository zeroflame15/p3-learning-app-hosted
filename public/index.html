<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>P3 Learning App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  /* Calm mint world (myKx review 2026-11-05): pale sage background,
     white cards, dark forest-green text, golden-yellow buttons,
     lavender/purple mascot accents, gold sparkles. */
  --bg:#eaf5e6; --bg2:#dcefd6; --panel:#ffffff; --panel2:#f0f7ec;
  --ink:#1e3a24; --ink-soft:#57705a; --line:#c9dcc6;
  --amber:#ffc94d; --amber-d:#7d6218; --teal:#3e8e52; --teal-soft:#dff2e2;
  --coral:#c0392b; --coral-soft:#fdeceb; --sky:#1d4ed8; --sky-soft:#dbeafe;
  --green:#2f7a3d; --green-soft:#dff2e2; --gold:#ffc94d;
  --nav:#1f4a2e; --nav-ink:#f5f1e6; --shadow:0 10px 30px rgba(30,60,35,.14);
  --card:#fffaf0; --card-text:#23402c;
  --tint:rgba(46,160,90,.30); --glow:#7be495;
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Nunito",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
h1,h2,h3,.display{font-family:"Fredoka","Nunito",sans-serif}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--sky)}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:228px;flex:0 0 228px;background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .bname{font-family:"Fredoka";font-weight:800;font-size:1.15rem;line-height:1.1}
.brand .bsub{font-size:.72rem;opacity:.75;font-weight:700}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;background:transparent;border:0;color:var(--nav-ink);padding:11px 12px;border-radius:12px;font-size:.98rem;font-weight:800;text-align:left;margin-bottom:4px}
.navbtn .nic{font-size:2rem;width:40px;text-align:center}
.navbtn:hover{background:rgba(255,255,255,.08)}
.navbtn.active{background:var(--amber);color:#231a02}
.sidebar .spacer{flex:1}
.doorlink{font-size:.8rem;opacity:.85;text-align:center;padding:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 20px;position:sticky;top:0;background:var(--bg);z-index:20;border-bottom:2px solid var(--line)}
.topbar .page-title{font-family:"Fredoka";font-weight:800;font-size:1.3rem}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:900;font-size:.9rem}
/* Game timer chip: dark forest-green ink on solid white, so it stays
   readable on every game hero — the plain .chip inherits the Play
   route's cream text (#f5f1e6) on its pale-mint pill, which was
   nearly invisible (seen live 2026-11-07). */
.timechip{background:#fff;color:#1e3a24;border-color:#1e3a24}
.iconbtn{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:1.1rem;display:inline-flex;align-items:center;justify-content:center}
.iconbtn.on{background:var(--amber);border-color:var(--amber)}
.avatarbtn{width:46px;height:46px;border-radius:50%;border:3px solid var(--amber);background:var(--panel);padding:0;overflow:hidden;display:inline-flex}
.content{padding:20px;max-width:1080px;width:100%;margin:0 auto}
.view{display:none}
.view.active{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.view.active{animation:none}}

/* ---------- Generic ---------- */
.card{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 6px}
.muted{color:var(--ink-soft)}
.small{font-size:.85rem}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:#231a02;border:0;border-radius:999px;padding:11px 20px;font-weight:900;font-size:1rem;box-shadow:0 4px 0 var(--amber-d)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--amber-d)}
.btn.teal{background:var(--teal);color:#fff;box-shadow:0 4px 0 #2f6b3a}
.btn.ghost{background:var(--panel);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 4px 0 #9f1239}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c4{grid-template-columns:repeat(4,1fr)}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:.75rem;font-weight:900}
.pill.eng{background:var(--sky-soft);color:var(--sky)}
.pill.math{background:var(--panel2);color:var(--amber-d)}
.pill.sci{background:var(--green-soft);color:var(--green)}
.pill.chi{background:var(--coral-soft);color:var(--coral)}
.pill.done{background:var(--green-soft);color:var(--green)}
.pill.prog{background:var(--panel2);color:var(--amber-d)}
.progressbar{height:12px;background:var(--bg);border:2px solid var(--line);border-radius:999px;overflow:hidden}
.progressbar>div{height:100%;background:var(--teal);border-radius:999px;transition:width .4s}

/* ---------- Door ---------- */
.doorwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:
  linear-gradient(rgba(16,15,44,.62),rgba(16,15,44,.62)), url(assets/terrarium.webp) center/cover no-repeat, var(--bg)}
.doorcard{max-width:560px;width:100%;text-align:center}
.doorcard h1{font-size:2.1rem;margin:8px 0 2px}
.codebubbles{display:flex;gap:12px;justify-content:center;margin:16px 0}
.codebubbles .bub{width:64px;height:64px;border-radius:50%;border:3px dashed var(--line);background:var(--panel);font-size:1.9rem;display:flex;align-items:center;justify-content:center}
.codebubbles .bub.filled{border-style:solid;border-color:var(--amber)}
.picgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}
.picbtn{font-size:1.8rem;padding:10px 0;border-radius:14px;border:2px solid var(--line);background:var(--panel)}
.picbtn:hover{border-color:var(--amber);transform:scale(1.06)}
.lvlpick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0 4px}
.lvlbtn{font-size:1.05rem;font-weight:900;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:var(--panel);cursor:pointer}
.lvlbtn:hover{border-color:var(--amber);transform:scale(1.05)}
.lvlbtn.sel{border-color:var(--amber);background:#fff7d6;box-shadow:0 0 0 2px var(--amber)}
.explorerrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:14px 0}
.explorerchip{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-weight:900}
.explorerchip:hover{border-color:var(--amber)}
.explorerchip .face{font-size:2rem}
.field{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-size:1rem;font-weight:700}
label.flabel{display:block;font-weight:900;margin:12px 0 6px;text-align:left}

/* ---------- Home / Pip ---------- */
.hero{display:flex;gap:18px;align-items:center}
.pipwrap{flex:0 0 128px;text-align:center}
.pipwrap svg{width:128px;height:128px}
.pipname{font-family:"Fredoka";font-weight:800}
.speech{background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:12px 14px;position:relative;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:2px solid var(--gold);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:900;font-size:.85rem;margin:3px}

/* ---------- Quiz ---------- */
.optbtn{display:block;width:100%;text-align:left;background:var(--panel);border:2.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.05rem;font-weight:800;color:var(--ink);margin-bottom:10px}
.optbtn:hover{border-color:var(--sky)}
.optbtn.picked{border-color:var(--sky);background:var(--sky-soft)}
.optbtn.right{border-color:var(--green);background:var(--green-soft);animation:pop .35s ease}
.optbtn.wrong{border-color:var(--coral);background:var(--coral-soft)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
.feedback{border-radius:14px;padding:14px 16px;font-weight:800;margin:10px 0}
.feedback.ok{background:var(--green-soft);color:#1e3a24}
.feedback.no{background:var(--coral-soft);color:#1e3a24}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:1.5rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(340deg)}}
.trophy{font-size:4rem;animation:pop .5s ease infinite alternate;display:inline-block}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes fxHop{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-26px) scale(1.05)}55%{transform:translateY(0) scale(1)}75%{transform:translateY(-12px)}100%{transform:translateY(0)}}
@keyframes fxWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg) scale(1.03)}75%{transform:rotate(5deg) scale(1.03)}}
@keyframes fxFloatUp{0%{opacity:0;transform:translateY(8px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-74px) scale(1.2)}}
.fx-hop{animation:fxHop .95s ease}
.fx-wiggle{animation:fxWiggle .9s ease-in-out}
.fx-float{position:absolute;bottom:12px;animation:fxFloatUp 1.4s ease-out forwards;pointer-events:none;font-size:1.7rem;z-index:2}
/* ---------- Live frog pond: the frog is layered SVG art that
   lives in its pond — it wanders, blinks, breathes and can be
   dragged. No WebGL, no raster sprite: depth comes from radial
   gradients, shading and a soft shadow, Pip-style. */
.pond{position:relative;height:280px;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#bfe9ff 0%,#8fd0ea 42%,#4aa88a 78%,#2f8f6d 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.pond-lily{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8ed9a0,#3d9e57 70%);opacity:.92;z-index:1}
.pond-bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);z-index:1}
.frog-wrap{position:absolute;transform:translate(-50%,-50%);transition:left 1.3s ease-in-out,top 1.3s ease-in-out;cursor:grab;touch-action:none;z-index:3}
/* A bigger invisible grab zone: the frogspawn cluster is the
   smallest stage (150px), so the wrap gets a 16px halo that still
   catches a press — and the frog holds still on hover (bindCritter)
   so an aimed press lands on it instead of empty pond. */
.frog-wrap::before{content:'';position:absolute;inset:-16px}
/* During Play the frog must track the pointer, not drift — the
   1.3s wander transition is far too slow for a chase. */
.pond.playing .frog-wrap{transition:left .3s ease-out,top .3s ease-out}
.pond.dragging .frog-wrap{transition:none}
.pond.playing .pond-toy{transition:left .12s linear,top .12s linear}
.frog-wrap:active{cursor:grabbing}
.frog-bob{display:inline-block;transform-origin:50% 92%}
.frog-bob svg{height:100%;width:auto;display:block;filter:drop-shadow(0 10px 10px rgba(10,40,30,.25))}
.frog-eye{transform-box:fill-box;transform-origin:center;animation:frogBlink 4.6s infinite}
@keyframes frogBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.frog-body{transform-box:fill-box;transform-origin:50% 100%;animation:frogBreathe 3.2s ease-in-out infinite}
@keyframes frogBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03,1.05)}}
.frog-bubble{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:88%;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:800;font-size:.92rem;z-index:6;box-shadow:var(--shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frog-bubble:after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.dirt-spot{position:absolute;width:36px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a9805a,#6b4a2a 70%);border:0;cursor:pointer;z-index:4;pointer-events:auto;box-shadow:inset 0 -3px 5px rgba(0,0,0,.3)}
.dirt-spot:hover{transform:scale(1.12)}
.pond-toy{position:absolute;font-size:2rem;z-index:4;pointer-events:none;transition:left .25s linear,top .25s linear;transform:translate(-50%,-50%)}
#pondDirt{position:absolute;inset:0;z-index:4;pointer-events:none}
@media (prefers-reduced-motion: reduce){.frog-eye,.frog-body,.frog-wrap{animation:none;transition:none}}
.bouncy{animation:bounce 1s ease infinite}
@media (prefers-reduced-motion: reduce){.trophy,.bouncy,.confetti span{animation:none}}

/* ---------- Play ---------- */
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:440px}
.memcard{aspect-ratio:1;border-radius:14px;border:2.5px solid var(--line);background:var(--nav);color:#fff;font-size:1.7rem;display:flex;align-items:center;justify-content:center;font-weight:900;perspective:600px;padding:0}
.meminner{display:block;width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s ease}
.memcard.open .meminner,.memcard.matched .meminner{transform:rotateY(180deg)}
.memface{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.memfront{background:var(--nav);color:#fff}
.memback{background:var(--panel);color:var(--ink);transform:rotateY(180deg)}
.memcard.matched .memback{background:var(--green-soft)}
.memcard.matched{border-color:var(--green)}
@media (prefers-reduced-motion: reduce){.meminner{transition:none}}

/* ---------- Number Pop balloons + Speed Sort big tiles ---------- */
.balloonrow{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:18px 4px 6px;height:200px;overflow:hidden}
.balloon{position:relative;background:none;border:0;cursor:pointer;padding:0;width:104px;height:128px;animation:balloonRise var(--rise,10s) linear both}
.balloonwrap.done .balloon{animation:none;transform:none}
.balloonwrap.done .escapefill{animation-play-state:paused}
.escapebar{height:10px;background:#e8e2d5;border-radius:6px;overflow:hidden;margin:8px 0 2px}
.escapefill{height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444);animation:escapeShrink var(--rise,10s) linear both}
@keyframes escapeShrink{from{width:100%}to{width:0%}}
.balloon .b-emoji{font-size:4.4rem;line-height:1;display:block;filter:drop-shadow(0 6px 6px rgba(10,40,30,.25))}
.balloon .b-num{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:1.15rem;font-weight:900;color:#3a2b00;font-family:'Fredoka'}
.balloon:disabled{cursor:default}
.balloon.right .b-emoji{filter:drop-shadow(0 0 14px rgba(143,209,139,.9))}
.balloon.wrong{opacity:.55}
.balloon.wrong .b-num{color:var(--coral)}
.balloon.popped{animation:balloonPop .45s ease-out both}
@keyframes balloonRise{from{transform:translateY(210px)}to{transform:translateY(-170px)}}
@keyframes balloonPop{0%{transform:scale(1)}40%{transform:scale(1.28) rotate(-7deg)}100%{transform:scale(1)}}
.sortgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 0 4px}
.sorttile{min-height:118px;border-radius:18px;border:3px solid var(--line);background:var(--panel);font-size:3rem;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:tileIn .45s ease both;animation-delay:var(--d,0s)}
.sorttile:hover{border-color:var(--sky)}
.sorttile.right{border-color:var(--green);background:var(--green-soft);animation:pop .35s ease}
.sorttile.wrong{border-color:var(--coral);background:var(--coral-soft);opacity:.6}
.sorttile:disabled{cursor:default}
@keyframes tileIn{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
/* ---------- Word Scramble tiles + slots ---------- */
.scrslots{display:flex;gap:8px;justify-content:center;padding:12px 0 4px;flex-wrap:wrap}
.scrslot{width:52px;height:60px;border:3px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:900;background:var(--panel);font-family:'Fredoka';cursor:pointer}
.scrslot.filled{border-style:solid;border-color:var(--sky);background:var(--sky-soft)}
.scrslot.right{border-color:var(--green);background:var(--green-soft)}
.scrslot.wrong{border-color:var(--coral);background:var(--coral-soft)}
.scrslot:disabled{cursor:default}
.scrtiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px 0}
.scrtile{min-width:52px;height:60px;border-radius:14px;border:3px solid var(--line);background:var(--panel);font-size:1.8rem;font-weight:900;cursor:pointer;font-family:'Fredoka';animation:tileIn .4s ease both;animation-delay:var(--d,0s)}
.scrtile:hover{border-color:var(--sky)}
.scrtile.used{opacity:.25;cursor:default}
.scrtile:disabled{cursor:default}
.scrbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.hintline{background:var(--sky-soft);border-radius:12px;padding:10px 14px;font-weight:800;margin:10px 0}
/* ---------- Maths Race track + countdown ---------- */
.racetrack{margin:10px 0 4px}
.racebar{height:14px;border-radius:8px;background:#e8e2d5;overflow:hidden}
.racebarfill{height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444);transition:width 1s linear}
.racelane{position:relative;height:46px;margin-top:6px}
.racelab{position:absolute;left:0;top:12px;font-size:.8rem;font-weight:900;color:var(--ink)}
.racer{position:absolute;top:0;font-size:2rem;transition:left .6s ease;left:0}
.raceflag{position:absolute;right:0;top:4px;font-size:1.5rem}
@media (prefers-reduced-motion: reduce){.balloon{animation:none}.balloon.popped{animation:none}.escapefill{animation:none}.sorttile,.scrtile{animation:none}.racebarfill,.racer{transition:none}}
.bigq{font-size:1.5rem;font-weight:900;text-align:center;padding:10px}
.garden{background:#eaf7e9;border:2px solid #bfe3b4;border-radius:14px;padding:10px;margin:10px 0;text-align:center}
.gardenrow{display:flex;gap:6px;justify-content:center;font-size:1.9rem;line-height:1}
.gflower{display:inline-block;animation:flowerPop .45s ease}
@keyframes flowerPop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
/* ---------- Crossword Quest + Exit Parking ---------- */
.xwgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:340px;margin:14px auto}
.xwcell{aspect-ratio:1;border:2.5px solid var(--line);border-radius:10px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:900;position:relative;color:var(--ink)}
.xwcell.blank{border-color:transparent;background:transparent}
.xwcell.lit{background:var(--green-soft);border-color:var(--green)}
.xwcell.sel{background:#fff3c4;border-color:#d9a400}
.xwcell.cur{box-shadow:0 0 0 3px #f59e0b}
.xwcell.bad{background:#fee2e2;border-color:#dc2626;color:#991b1b}
.xwlet{pointer-events:none}
.xwclues{display:grid;gap:6px;margin-top:12px}
.xwclue{display:flex;gap:8px;align-items:baseline;text-align:left;width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;font-size:.95rem}
.xwclue.active{border-color:#d9a400;background:#fff3c4}
.xwclue.done{opacity:.55}
.xwclue.done .xwclue-t{text-decoration:line-through}
.xwnum{position:absolute;top:2px;left:5px;font-size:.62rem;font-weight:900;color:var(--ink-soft)}
.parklot{position:relative;max-width:340px;margin:14px auto;aspect-ratio:1}
.parkcell{position:absolute;border:2px dashed var(--line);border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.parkcell.exit{border-style:solid;border-color:var(--amber);background:#fff7e0}
.parkcar{position:absolute;border-radius:12px;border:2.5px solid var(--line);font-size:1.7rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:left .28s ease,top .28s ease;padding:0}
.parkcar.red{background:#ffe1e1;border-color:#d33}
.parkshake{animation:parkshake .3s ease}
@keyframes parkshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* ---------- Sentence Builder tiles + build strip ---------- */
.sbstrip{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:64px;padding:12px;border:3px dashed var(--line);border-radius:14px;background:var(--panel2);margin:12px 0}
.sbslot{min-width:64px;height:52px;border-radius:12px;border:2.5px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:900;font-family:'Fredoka';cursor:pointer}
.sbslot.empty{border-style:dashed;color:var(--ink-soft);cursor:default}
.sbslot.locked{background:var(--green-soft);border-color:var(--green);color:var(--green);cursor:default}
.sbbank{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:6px 0}
.sbtile{min-width:64px;height:52px;border-radius:12px;border:2.5px solid var(--line);background:var(--panel);font-size:1.25rem;font-weight:900;font-family:'Fredoka';cursor:pointer;animation:tileIn .35s ease both}
.sbtile:hover{border-color:var(--sky)}
.sbtile.used{opacity:.25;cursor:default}
.sbtile:disabled{cursor:default}
/* ---------- Crossword Quest progress dots ---------- */
.xwdots{display:flex;gap:6px;justify-content:center;margin:10px 0 2px}
.xwdot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--panel)}
.xwdot.done{background:var(--green);border-color:var(--green)}

/* ---------- Ask Pip ---------- */
.threadrow{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:800;color:var(--ink);margin-bottom:8px}
.threadrow.active{border-color:var(--amber)}
.chatlog{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:6px 2px}
.msg{max-width:82%;padding:11px 14px;border-radius:16px;font-weight:700;line-height:1.45;white-space:pre-wrap}
.msg.kid{align-self:flex-end;background:var(--sky);color:#fff;border-bottom-right-radius:4px}
.msg.pip{align-self:flex-start;background:var(--panel2);border:2px solid var(--line);border-bottom-left-radius:4px}
.chatbar{display:flex;gap:8px;margin-top:12px}

/* ---------- Critter / Treasure ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:14px;border:2.5px solid var(--line);background:var(--panel);font-weight:900;font-size:.85rem;text-align:center}
.stage .se{font-size:2.2rem}
.stage.sel{border-color:var(--teal);background:var(--teal-soft)}
.treasure{display:flex;gap:14px;align-items:flex-start}
.treasure .te{font-size:2.4rem;flex:0 0 auto}

/* ---------- Parent ---------- */
table.ledger{width:100%;border-collapse:collapse}
table.ledger th,table.ledger td{padding:9px 10px;border-bottom:2px solid var(--line);text-align:left;font-weight:700}
.pinDots{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pinDots .d{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink-soft)}
.pinDots .d.f{background:var(--amber);border-color:var(--amber)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.keypad button{padding:14px 0;font-size:1.25rem;font-weight:900;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink)}

/* ---------- Menu / modal ---------- */
.menu{position:absolute;top:64px;right:16px;width:290px;background:var(--panel);border:2px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;z-index:60}
.menu button.mitem{display:flex;gap:10px;align-items:center;width:100%;background:var(--panel2);border:0;border-radius:12px;padding:13px;font-weight:900;font-size:.98rem;color:var(--ink);margin-bottom:8px;text-align:left}
.overlay{position:fixed;inset:0;background:rgba(8,10,30,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--panel);border-radius:20px;max-width:480px;width:100%;padding:22px;max-height:90vh;overflow-y:auto;border:2px solid var(--line)}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--nav);color:#fff;padding:11px 20px;border-radius:999px;font-weight:900;z-index:95;display:none;box-shadow:var(--shadow)}
.bottomnav{display:none}
.starsRow{font-size:1.6rem;letter-spacing:4px}

/* ---------- Pip: 3D animated otter (Mira-style) ---------- */
.otter3d{display:inline-block;animation:otterFloat 3.2s ease-in-out infinite;transform-style:preserve-3d;perspective:600px;vertical-align:middle}
.otter3d .otter-ring{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;animation:otterTilt 5s ease-in-out infinite}
.otter3d img{width:100%;height:100%;object-fit:cover;object-position:50% 32%;display:block;transform:scale(1.22)}
.otter3d .otter-shine{position:absolute;inset:0;border-radius:50%;background:linear-gradient(125deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,0) 42%);pointer-events:none}
@keyframes otterFloat{0%,100%{transform:translateY(0) rotate(-1.6deg)}50%{transform:translateY(-7px) rotate(1.6deg)}}
@keyframes otterTilt{0%,100%{transform:rotateY(-7deg) rotateX(3deg)}50%{transform:rotateY(7deg) rotateX(-3deg)}}
.otter3d .eye{transform-box:fill-box;transform-origin:center;animation:otterBlink 4.4s infinite}
@keyframes otterBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.otter3d .pawwave{transform-box:fill-box;transform-origin:20% 85%;animation:otterWave 2.6s ease-in-out infinite}
@keyframes otterWave{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-22deg)}}
.otter3d .leafsway{transform-box:fill-box;transform-origin:50% 100%;animation:leafSway 3s ease-in-out infinite}
@keyframes leafSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(6deg)}}
.otter3d .earl{transform-box:fill-box;transform-origin:80% 80%;animation:earWig 5s ease-in-out infinite}
.otter3d .earr{transform-box:fill-box;transform-origin:20% 80%;animation:earWig 5s ease-in-out infinite reverse}
@keyframes earWig{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-9deg)}96%{transform:rotate(7deg)}}
.otter3d .tongue{transform-box:fill-box;transform-origin:50% 0;animation:tongueWig 3.4s ease-in-out infinite}
@keyframes tongueWig{0%,100%{transform:rotate(-2deg) scaleY(1)}50%{transform:rotate(3deg) scaleY(1.08)}}
@media (prefers-reduced-motion: reduce){.otter3d,.otter3d .eye,.otter3d .pawwave,.otter3d .leafsway,.otter3d .earl,.otter3d .earr,.otter3d .tongue{animation:none}}

/* ---------- Inner pages: same terrarium treatment as Home ---------- */
.pagehero{position:relative;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);color:#fff;margin-bottom:18px}
.pagehero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.flowhero{display:flex;gap:12px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.subjecthead{display:flex;align-items:center;gap:11px;margin:24px 0 12px}

<script>
/* ============================================================
   Jiyuna's Learning App — hosted version
   Progress is saved per explorer in browser storage AND synced
   to the server under a random 6-letter family sync code, so any
   device linked with that code shares the same family record.
   No child's real name is ever used as a server identifier.
   ============================================================ */

/* ---------- Cute funny otter Pip (hand-drawn SVG) ---------- */
function pipSVG(size, glow){
  glow = glow || '#ffb020';
  return '<span class="otter3d" style="width:'+size+'px;height:'+size+'px">'
   + '<span class="otter-ring" style="box-shadow:0 0 0 3px '+glow+', 0 12px 22px rgba(15,20,50,.35), inset 0 -14px 24px rgba(0,0,0,.18)">'
   + '<img src="assets/pip-otter.png" alt="Pip the otter" width="'+size+'" height="'+size+'" draggable="false">'
   + '<span class="otter-shine"></span></span></span>';
}
/* ---------- Sound engine (WebAudio, no files) ---------- */
var AC=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function isMuted(){ try{ return localStorage.getItem('jyn-muted')==='1'; }catch(e){ return false; } }
function toggleMute(){ var m=!isMuted(); try{ localStorage.setItem('jyn-muted', m?'1':'0'); }catch(e){} return m; }
function tone(freq,t0,dur,type,vol){
  if(isMuted())return;
  var ac=audio(); if(!ac)return;
  var o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  var s=ac.currentTime+t0;

/* Pip read-aloud: warmest available voice, sentence by sentence.
   iPhone Chrome was silent — three iOS quirks, all fixed here:
   1. getVoices() can stay empty and voiceschanged may never fire,
      so the old code waited forever for voices and never spoke.
      Now: speak anyway with the system default voice if none are
      listed yet.
   2. cancel() then speak() in the same tick swallows the utterance
      on iOS. Now: speak starts a beat after a cancel.
   3. Queued utterances stall on iOS. Now: sentences are chained
      one at a time — the next starts only when the previous ends. */
function speakPip(text){
  if(!('speechSynthesis' in window)){ toast('Sorry — this device has no read-aloud voice.'); return; }
  var isChi=/[\u4e00-\u9fff]/.test(text);
  var parts=(text.match(/[^.!?。！？]+[.!?。！？]*/g)||[text]).map(function(p){ return p.trim(); }).filter(Boolean);
  if(!parts.length)parts=[text];
  var warned=false;
  function pickVoice(){
    var voices=speechSynthesis.getVoices()||[];
    var vs=voices.filter(function(v){ return v.lang&&v.lang.toLowerCase().indexOf(isChi?'zh':'en')===0; });
    if(!vs.length)vs=voices;
    var good=isChi?['xiaoxiao','tingting','meijia','google']:['natural','neural','google','samantha','zira','jenny','aria'];
    for(var i=0;i<good.length;i++){ var m=vs.filter(function(v){ return v.name.toLowerCase().indexOf(good[i])>=0; }); if(m.length)return m[0]; }
    var bad=['fred','albert','bad news','organ','cellos','zarvox','trinoids','robot'];
    var ok=vs.filter(function(v){ var n=v.name.toLowerCase(); return !bad.some(function(b){ return n.indexOf(b)>=0; }); });
    return ok[0]||vs[0]||null;
  }
  function say(i){
    if(i>=parts.length)return;
    var u=new SpeechSynthesisUtterance(parts[i]);
    var v=pickVoice(); if(v)u.voice=v;
    u.lang=isChi?'zh-CN':'en-SG'; u.rate=0.98; u.pitch=1.12;
    u.onend=function(){ say(i+1); };
    u.onerror=function(ev){
      if(ev&&ev.error&&ev.error!=='canceled'&&ev.error!=='interrupted'){
        if(!warned){ warned=true; toast('No sound? Check the volume and the silent switch on the side of the phone.'); }
        say(i+1);
      }
    };
    speechSynthesis.speak(u);
  }
  if(speechSynthesis.speaking||speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(function(){ say(0); },150); }
  else say(0);
}
if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=function(){ speechSynthesis.getVoices(); }; }

function skillForQuestionClient(text){
  var q=String(text||'').toLowerCase();
  if(/\d\s*[x\u00d7*]\s*\d/.test(q))return SKILL_PACK.skills.find(function(x){return x.id==='times-tables';});
  if(/\d\s*[+\-]\s*\d/.test(q))return SKILL_PACK.skills.find(function(x){return x.id==='add-subtract';});
  var best=null, bestScore=0;
  SKILL_PACK.skills.forEach(function(sk){
    var sc=0; sk.keywords.forEach(function(kw){ if(q.indexOf(kw.toLowerCase())>=0)sc+=kw.length>4?2:1; });
    if(sc>bestScore){ bestScore=sc; best=sk; }
  });
  return bestScore>0?best:null;
}

<script>
/* ============================================================
   STATE — saved per explorer, in browser storage and synced to
   the server under the family sync code (see the sync block below)
   ============================================================ */
var LSKEY='jiyuna-learning-web-v1';
var DB=null;
/* Hosted: server sync. Device id is a random UUID in this browser only — no
   child's name is ever sent to the server. If the server is not configured
   (/api/progress answers configured:false) everything still works locally. */
/* --- Family sync code: the key that links devices -----------------
   A short random 6-letter code (no ambiguous 0/O, 1/I/L). It is NOT a
   name and it is NOT a password — anyone who knows it can pull the
   family progress, so grown-ups keep it like a house key and only
   share it with the family's own devices. The device UUID below is
   kept only as a fallback key for devices that have never been given
   a sync code. */
var SYNC_ALPHABET='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function makeSyncCode(){
  var c=''; for(var i=0;i<6;i++){ c+=SYNC_ALPHABET[Math.floor(Math.random()*SYNC_ALPHABET.length)]; } return c;
}
function normalizeSyncCode(v){ return String(v||'').toUpperCase().replace(/[\s\-]/g,''); }
function syncCodeValid(v){ return /^[A-Z2-9]{6}$/.test(String(v||'')) && String(v).split('').every(function(ch){ return SYNC_ALPHABET.indexOf(ch)>=0; }); }
function ensureSyncCode(){
  if(!DB)return null;
  if(!syncCodeValid(DB.syncCode))DB.syncCode=makeSyncCode();
  return DB.syncCode;
}
var DEVICE_ID=null;
try{ DEVICE_ID=localStorage.getItem('p3-device-id'); if(!DEVICE_ID){ DEVICE_ID='d-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); localStorage.setItem('p3-device-id',DEVICE_ID); } }catch(e){}
/* The server key: the family sync code when one exists, else the
   per-device fallback id. Every linked device shares the code, so
   they all read/write the same server row. */
function syncKey(){ return (DB&&syncCodeValid(DB.syncCode))?DB.syncCode:(DEVICE_ID||null); }
var syncTimer=null;
/* Guard shared by the pull and upload paths: while a pull is in
   flight, no second pull starts, and an upload requested in the
   meantime is queued once instead of starting a parallel pull. */
var syncPulling=false, syncUploadPending=false;
/* A save whose 800ms debounce fired while a pull was in flight was
   queued (syncUploadPending) — but only uploadAfterPull's own done()
   ever drained that flag, and a plain pull (syncFromServer) never
   did, so the save was silently lost unless a later save happened.
   That is how a brand-new explorer could never reach the server.
   Drain the flag here, on both the success and the failure path of
   every pull: if an upload was queued while this pull ran, start it
   now. It goes through syncToServer (debounced pull-then-upload),
   never a bare POST. */
function drainPendingUpload(){
  if(syncUploadPending){ syncUploadPending=false; syncToServer(); }
}
/* Bounded retries for a POST the server answers non-OK: a couple of
   more chances, then stop — an endless retry loop on a persistent
   server error would be worse than a lost save (the next save or
   auto-pull retries anyway). Reset on any successful POST. */
var postRetryCount=0;
function saveLocal(){ try{ localStorage.setItem(LSKEY, JSON.stringify(DB)); }catch(e){} }
/* Direct POST of the current local DB — no GET first. Used only by
   syncFromServer() after it has already pulled and merged, so a
   pull can never trigger another pull (no re-entrancy loop).
   The response is CHECKED now: a POST the server answers non-OK
   used to vanish silently, so a brand-new explorer could sit on
   this device forever looking synced. On a non-OK answer, log it
   and queue a bounded retry through syncToServer; a network error
   keeps the old fire-and-forget catch (the next save or auto-pull
   retries). */
function postToServer(key){
  if(!key||!DB)return;
  try{
    fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:key,device:DEVICE_ID,data:DB})}).then(function(r){
      if(r.ok){ postRetryCount=0; return; }
      if(typeof console!=='undefined'&&console.warn)console.warn('postToServer: server answered '+r.status+' — queuing a retry');
      if(postRetryCount<2){ postRetryCount++; syncToServer(); }
    }).catch(function(){});
  }catch(e){}
}
/* Pull-then-upload: before uploading, GET the server record and
   union-merge it into the local DB (mergeFamilyDB — never
   last-write-wins), so an upload can never overwrite newer progress
   made on another linked device with a stale local snapshot. If the

  var fc=document.getElementById('mFriendCode'); if(fc)fc.onclick=function(){ var live=ex(); var code=live&&live.friendCode?live.friendCode:''; if(!code)return; function done(){ toast('Friend code copied — share it so a friend can add '+live.name+'!'); } if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(done,function(){ toast('Friend code: '+code); }); } else { var ta=document.createElement('textarea'); ta.value=code; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(err){ toast('Friend code: '+code); } document.body.removeChild(ta); } };
}
function openLookModal(){
  var e=ex();
  openModal('<h3 style="margin-top:0">Change my name &amp; look 🎨</h3>'
   +'<label class="flabel">Magic name</label><input class="field" id="lkName" value="'+esc(e.name)+'" maxlength="20">'
   +'<label class="flabel">My animal friend</label><div style="display:flex;gap:8px;flex-wrap:wrap">'+['🦦','🐸','🦋','🐱','🐶','🐰','🦁','🐼','🦊','🐢','🐷','🐵'].map(function(a){return '<button class="iconbtn facePick" data-f="'+a+'" style="font-size:1.2rem;'+(e.face===a?'outline:3px solid var(--ink)':'')+'">'+a+'</button>';}).join('')+'</div>'
   +'<label class="flabel">Pip’s glow colour</label><div style="display:flex;gap:8px;flex-wrap:wrap">'+GLOWS.map(function(g){return '<button class="iconbtn glowPick" data-g="'+g+'" style="background:'+g+';'+(e.glow===g?'outline:3px solid var(--ink)':'')+'" aria-label="Glow '+g+'"></button>';}).join('')+'</div>'
   +'<label class="flabel">My badge</label><div style="display:flex;gap:8px;flex-wrap:wrap">'+['⭐','🦦','🌈','🚀','🍓','⚡','🐸','🦋','🌟','💎','🎨','🏆','🌸','🍀','🎵','❤️'].map(function(b){return '<button class="iconbtn badgePick" data-b="'+b+'" style="font-size:1.2rem;'+(e.badge===b?'outline:3px solid var(--amber)':'')+'">'+b+'</button>';}).join('')+'</div>'
   +'<div style="display:flex;gap:10px;margin-top:18px"><button class="btn" id="lkSave">Save my look</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>');
  /* Glow/badge/animal taps must NEVER rebuild the modal: rebuilding it from the
     saved name threw away a name the child had just typed but not saved
     yet. Update only the outlines in place, and keep the typed name.
     They must also NEVER write to the explorer captured when the modal
     opened: the background sync (~800ms after a save) replaces the
     whole DB object, so that captured copy is detached and a write to
     it is silently lost. Resolve the live explorer fresh on every tap. */
  document.querySelectorAll('.facePick').forEach(function(b){ b.onclick=function(){ var live=ex(); if(!live)return; var keepEl=document.getElementById('lkName'); var keep=keepEl?keepEl.value:''; var f=b.getAttribute('data-f'); if(live.face!==f){ live.face=f; live.lookAt=new Date().toISOString(); save(); } document.querySelectorAll('.facePick').forEach(function(x){ x.style.outline=(x===b?'3px solid var(--ink)':''); }); if(keepEl)keepEl.value=keep; }; });
  document.querySelectorAll('.glowPick').forEach(function(b){ b.onclick=function(){ var live=ex(); if(!live)return; var keepEl=document.getElementById('lkName'); var keep=keepEl?keepEl.value:''; var g=b.getAttribute('data-g'); if(live.glow!==g){ live.glow=g; live.lookAt=new Date().toISOString(); save(); } document.querySelectorAll('.glowPick').forEach(function(x){ x.style.outline=(x===b?'3px solid var(--ink)':''); }); if(keepEl)keepEl.value=keep; }; });
  document.querySelectorAll('.badgePick').forEach(function(b){ b.onclick=function(){ var live=ex(); if(!live)return; var keepEl=document.getElementById('lkName'); var keep=keepEl?keepEl.value:''; var bd=b.getAttribute('data-b'); if(live.badge!==bd){ live.badge=bd; live.lookAt=new Date().toISOString(); save(); } document.querySelectorAll('.badgePick').forEach(function(x){ x.style.outline=(x===b?'3px solid var(--amber)':''); }); if(keepEl)keepEl.value=keep; }; });
  document.getElementById('lkSave').onclick=function(){ var live=ex(); if(!live)return; var v=document.getElementById('lkName').value.trim(); if(v&&v!==live.name){ live.name=v; live.nameAt=new Date().toISOString(); } save(); closeModal(); render(); toast('Looking great, '+live.name+'!'); };
}
function openModal(html){
  var o=document.getElementById('overlay'); if(!o){ o=document.createElement('div'); o.className='overlay'; o.id='overlay'; document.body.appendChild(o); }
  o.innerHTML='<div class="modal">'+html+'</div>'; o.classList.add('open');
  o.onclick=function(ev){ if(ev.target===o)closeModal(); };
}
function closeModal(){ var o=document.getElementById('overlay'); if(o)o.classList.remove('open'); }

/* ============================================================
   GRAND DOOR — magic name + 3-picture code
   ============================================================ */
var doorMode='pick', doorSel=null, doorCode=[], doorLevel='P3';
function doorHTML(){
  var h='<div class="doorwrap"><div class="doorcard card">'
   + pipSVG(120,'#ffb020')
   +'<h1>The Grand Door</h1><p class="muted" style="font-weight:600;margin:2px 0 6px">Every explorer who enters the terrarium has a <b style="color:var(--ink)">magic name</b> and a <b style="color:var(--ink)">picture code</b> — no email needed. Pip the otter keeps the door.</p>';
  if(doorMode==='pick'){
    if(DB.explorers.length){
      h+='<p style="font-weight:800">Who is exploring today? Tap your name, then tap your 3 secret pictures in order.</p>'
       +'<div class="explorerrow">'+DB.explorers.map(function(e){ return '<button class="explorerchip" data-ex="'+e.id+'"><span class="face">'+e.face+'</span>'+esc(e.name)+' '+(e.badge||'⭐')+'<span class="small muted">⭐ '+e.stars+'</span></button>'; }).join('')+'</div>'
       +'<div id="doorCodeArea"></div>'
       +'<button class="btn ghost" id="doorNew">➕ I’m new — create my explorer</button>'
       +'<button class="btn ghost" id="doorLink" style="margin-left:8px">🔗 Link this device with a family code</button>';
    } else {
      h+='<p style="font-weight:800">Welcome, explorer! Let’s create your very first explorer.</p><button class="btn" id="doorNew">Start creating ✨</button>'
       +'<div style="margin-top:12px"><button class="btn ghost" id="doorLink">🔗 Link this device with a family code</button></div>'
       +'<p class="small muted" style="margin-top:8px">Already have a family? Tap “Link this device” and type your 6-letter family sync code to pull down your progress.</p>';
    }
  } else if(doorMode==='link'){
    h+='<p style="font-weight:800">Link this device to your family</p>'
     +'<p class="muted" style="font-weight:700">Ask a grown-up for the 6-letter family sync code (it is on the parent page, under “Family sync”). Type it here and this device will pull down the family’s progress and keep in sync.</p>'
     +'<label class="flabel">Family sync code</label><input class="field" id="linkCode" placeholder="e.g. ABC2DE" maxlength="7" style="text-align:center;text-transform:uppercase;letter-spacing:2px;font-weight:900">'
     +'<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px"><button class="btn" id="linkBtn">Link this device 🔗</button><button class="btn ghost" id="doorBack">Back</button></div>';
  } else {
    h+='<label class="flabel">Choose your magic name</label><input class="field" id="newName" placeholder="e.g. MightyOtter" maxlength="20">'
     +'<label class="flabel">Which primary level are you in?</label><div class="lvlpick" id="newLevel">'+LEVELS.map(function(l){ return '<button type="button" class="lvlbtn'+(l===doorLevel?' sel':'')+'" data-lvl="'+l+'">'+l+'</button>'; }).join('')+'</div>'
     +'<label class="flabel">Pick 3 secret pictures for your picture code (remember the order!)</label>'
     +'<div class="codebubbles" id="newBubbles"></div>'
     +'<div class="picgrid">'+PIC_CHOICES.map(function(p){ return '<button class="picbtn" data-pic="'+p+'">'+p+'</button>'; }).join('')+'</div>'
     +'<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" id="createBtn">Open my door 🚪</button><button class="btn ghost" id="doorBack">Back</button></div>';
  }
  h+='<p class="small muted" style="margin-top:16px">Grown-ups: tap “Grown-ups” below to open the parent page with your PIN — no picture code needed. Progress syncs across devices linked with your family code — or stays on this device if you never link it.</p>'
   +'<div style="margin-top:10px"><button class="btn ghost" id="doorGrownups">🌙 Grown-ups</button></div></div></div>';
  return h;
}
function renderBubbles(el, arr){
  el.innerHTML=[0,1,2].map(function(i){ return '<div class="bub '+(arr[i]?'filled':'')+'">'+(arr[i]||'·')+'</div>'; }).join('');
}
function bindDoor(){
  var nb=document.getElementById('doorNew');
  if(nb)nb.onclick=function(){ doorMode='create'; doorCode=[]; render(); };
  var lk=document.getElementById('doorLink');
  if(lk)lk.onclick=function(){ doorMode='link'; doorCode=[]; render(); };
  /* Grown-ups entry (fix 6c): straight to the PIN screen, no picture
     code needed — the PIN is the grown-up gate. */
  var dg=document.getElementById('doorGrownups');
  if(dg)dg.onclick=function(){ sndPop(); go('parent'); };
  /* Back must work on EVERY door screen. It used to be bound after
     the link-mode early return below, so on the link screen it had
     no handler at all and the button did nothing (fix 6b). */
  var back=document.getElementById('doorBack');
  if(back)back.onclick=function(){ doorMode='pick'; doorSel=null; doorCode=[]; render(); };
  if(doorMode==='link'){
    document.getElementById('linkBtn').onclick=function(){
      var v=document.getElementById('linkCode').value;
      linkDevice(v).then(function(ok){ if(ok){ doorMode='pick'; toast('This device is linked! Welcome to the family terrarium. 🔗'); render(); } });
    };
    return;
  }
  if(doorMode==='create'){
    renderBubbles(document.getElementById('newBubbles'), doorCode);
    document.querySelectorAll('[data-lvl]').forEach(function(b){ b.onclick=function(){ doorLevel=b.getAttribute('data-lvl'); document.querySelectorAll('[data-lvl]').forEach(function(x){ x.classList.toggle('sel',x===b); }); sndPop(); }; });
    document.querySelectorAll('[data-pic]').forEach(function(b){ b.onclick=function(){ sndMystery(); if(doorCode.length<3){ doorCode.push(b.getAttribute('data-pic')); } else { doorCode=[b.getAttribute('data-pic')]; } renderBubbles(document.getElementById('newBubbles'), doorCode); }; });
    document.getElementById('createBtn').onclick=function(){
      var name=document.getElementById('newName').value.trim();
      if(!name){ toast('Pick a magic name first!'); return; }
      if(doorCode.length!==3){ toast('Pick exactly 3 pictures for your code!'); return; }
      var e=newExplorer(name, doorCode.slice(), doorLevel);
      DB.explorers.push(e); DB.activeId=e.id; doorMode='pick'; doorCode=[]; doorLevel='P3'; save();
      sndEntrance(); toast('Welcome, '+name+'! The Grand Door opens! 🚪✨'); go('home');
    };
  } else {
    document.querySelectorAll('[data-ex]').forEach(function(b){ b.onclick=function(){ doorSel=b.getAttribute('data-ex'); doorCode=[]; showDoorCode(); }; });
  }
}
function showDoorCode(){
  var area=document.getElementById('doorCodeArea'); if(!area)return;
  var target=DB.explorers.find(function(e){return e.id===doorSel;});
  area.innerHTML='<p style="font-weight:900">Hello, '+esc(target.name)+'! Tap your 3 secret pictures:</p>'
   +'<div class="codebubbles" id="loginBubbles"></div>'
   +'<div class="picgrid">'+PIC_CHOICES.map(function(p){ return '<button class="picbtn" data-lpic="'+p+'">'+p+'</button>'; }).join('')+'</div>'
   +'<button class="btn ghost" id="loginCancel">Cancel</button>';
  renderBubbles(document.getElementById('loginBubbles'), doorCode);
  document.querySelectorAll('[data-lpic]').forEach(function(b){ b.onclick=function(){
    sndMystery(); doorCode.push(b.getAttribute('data-lpic'));
    renderBubbles(document.getElementById('loginBubbles'), doorCode);
    if(doorCode.length===3){
      if(JSON.stringify(doorCode)===JSON.stringify(target.code)){ DB.activeId=target.id; save(); doorSel=null; doorCode=[]; sndEntrance(); toast('The Grand Door opens! Welcome back, '+target.name+'!'); go('home'); }
      else { sndWrong(); toast('Hmm, those pictures don’t match. Try again!'); doorCode=[]; setTimeout(showDoorCode,600); }
    }
  }; });
  document.getElementById('loginCancel').onclick=function(){ doorSel=null; doorCode=[]; render(); };
}
</script>
<script>

   and the choice is saved per explorer.

 'Frog Pond':{tint:'rgba(46,160,90,.30)',glow:'#7be495',line:'Splash! This week we hop around the Frog Pond.',dots:['#bfe3c0','#7be495','#2f7a3d']},
 'Magnet Lab':{tint:'rgba(214,64,84,.28)',glow:'#ff9d8a',line:'Snap! This week we experiment in the Magnet Lab.',dots:['#ffd9d2','#ff9d8a','#d64054']},
 'Star Garden':{tint:'rgba(240,178,60,.30)',glow:'#ffd97a',line:'Twinkle! This week we grow ideas in the Star Garden.',dots:['#fdeecb','#ffd97a','#e0a92e']},
 'Ocean Deep':{tint:'rgba(38,116,210,.34)',glow:'#7cc4ff',line:'Whoosh! This week we dive into the Ocean Deep.',dots:['#cfe4ff','#7cc4ff','#2674d2']},
 'Sky Castle':{tint:'rgba(140,96,220,.30)',glow:'#c9a8ff',line:'Wheee! This week we float up to the Sky Castle.',dots:['#e3d9ff','#c9a8ff','#8c60dc']}
};
/* Themes saved by older web builds keep working — they resolve to the
   matching Muse-version theme, so no saved choice is ever lost. */
var THEME_ALIAS={'Ocean Dive':'Ocean Deep','Garden Party':'Star Garden','Space Adventure':'Sky Castle','Dino Discovery':'Magnet Lab'};
function themeName(e){ var n=e&&e.theme; if(THEME_ALIAS[n])n=THEME_ALIAS[n]; return THEMES[n]?n:'Frog Pond'; }
function themeOf(e){ return THEMES[themeName(e)]; }
function applyTheme(){
  var e=ex(); if(!e)return; var t=themeOf(e);
  document.documentElement.style.setProperty('--tint', t.tint);
  document.documentElement.style.setProperty('--glow', t.glow);
}
function greeting(){ var h=new Date().getHours(); return h<12?'Good morning':(h<18?'Good afternoon':'Good evening'); }
var PIP_SAYS=['Warm up with a quick game in Play? It wakes your brain right up!','Your frog friend is waiting in Critter Lab. One good visit helps it grow!','One quest question at a time. Small hops make a big frog!','Feeling wobbly or sparkling today? A calm sound in the Vibe Zone helps.','Try today’s quest — finishing all 5 questions earns a big celebration!'];

   tint and Pip treatment as the Home hero, so every page feels like

   +(stat?'<div class="herostat">'+stat+'</div>':'')

/* ============================================================ HOME */
function homeHTML(){
  var e=ex(), t=themeOf(e), tname=themeName(e);
  var doneCount=Object.keys(e.completed).length;
  var unfinished=TOPICS.filter(function(x){return !e.completed[x.id];});
  /* The study timetable IS the daily plan: Today's quest is picked
     from today's study subjects (Mon English+Maths, Tue Science+
     Chinese, Wed light/Chinese, Thu Maths+Science, Fri English+
     Chinese+review). Sunday reviews anything unfinished — or, if
     all is done, a finished quest's fresh set. Saturday is rest. */
  var todayPlan=studyPlanFor(new Date().getDay());
  var todayEvent=schoolEventFor(new Date());
  var planPool=planTopics(todayPlan).filter(function(x){return !e.completed[x.id];});
  if(todayPlan.review&&!planPool.length)planPool=TOPICS.slice();
  var poolForPick=planPool.length?planPool:unfinished;
  var picks=todayPlan.rest?[]:[poolForPick[e.swapIdx%Math.max(poolForPick.length,1)], poolForPick[(e.swapIdx+1)%Math.max(poolForPick.length,1)]].filter(Boolean);
  if(!picks.length&&!todayPlan.rest)picks=[TOPICS[e.swapIdx%TOPICS.length]];
  var quest=picks[0], alt=picks[1];
  var nextTreasure=TREASURES.find(function(x){return e.treasures.indexOf(x.id)<0;});
  var dayIdx=Math.floor(Date.now()/86400000);
  var pipSays=PIP_SAYS[dayIdx%PIP_SAYS.length];
  var memory='';
  if(e.lastTopic&&topicById(e.lastTopic)&&e.completed[e.lastTopic])memory='Pip remembers: you finished '+esc(topicById(e.lastTopic).name)+' — what a superstar!';
  else if(e.treasures.length){ var lt=TREASURES.filter(function(x){return e.treasures.indexOf(x.id)>=0;}).slice(-1)[0]; if(lt)memory='Pip remembers the day you unlocked the '+esc(lt.name)+'!'; }

  var compass=e.treasures.indexOf('compass')>=0&&quest? '<p class="small" style="font-weight:800;margin-top:10px">🧭 Star Compass points to: <b>'+esc(quest.name)+'</b> — a great next quest!</p>':'';
  var badgeHTML=e.badges.map(function(b){ var m={'brave':'🦁 Brave Tryer','comeback':'🏆 Comeback Kid','first':'🌟 First Quest','perfect':'💯 Perfect Quest','critter':'🐸 Critter Friend','player':'🎮 Arcade Star','spotter':'🔍 Critter Spotter','naturalist':'🌿 Young Naturalist'}; return m[b]?'<span class="badge">'+m[b]+'</span>':''; }).join('');
  var hero='<section class="heroT"><img class="bg" src="assets/terrarium.webp" alt="Jiyuna’s glowing terrarium at night"><div class="shade"></div><div class="tintwash"></div>'
   +'<div class="inner"><div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap"><div>'+pipSVG(88,e.glow)+'</div>'

   +'<div class="bubble" style="margin-top:8px">Pip says: “'+pipSays+'”</div>'
   +(memory?'<div class="memory">'+memory+'</div>':'')
   +'<div class="bubble" style="margin-top:8px">You have finished <b>'+doneCount+' of 14 quests</b> and collected <b>⭐ '+e.stars+' stars</b>. '+(doneCount>=14?'You finished EVERYTHING — legendary explorer!':'Ready for today’s adventure?')+'</div>'
   +'</div></div>'
   +'<div style="margin-top:18px"><div class="themeslabel">This week’s theme: '+esc(tname)+'</div>'
   +'<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px" role="group" aria-label="Pick this week’s theme">'
   + Object.keys(THEMES).map(function(name){ var th=THEMES[name]; return '<button type="button" class="themechip '+(tname===name?'sel':'')+'" data-theme="'+esc(name)+'" aria-pressed="'+(tname===name)+'">'+esc(name)+'<span class="themedots" aria-hidden="true">'+(th.dots||[]).map(function(c){ return '<i style="background:'+c+'"></i>'; }).join('')+'</span></button>'; }).join('')
   +'</div><div class="themeline">'+t.line+'</div></div>'
   +'</div></section>';
  var questCard='<section class="questcard'+(qdone?' done':'')+'"><div class="themeslabel" style="color:#8a6d1f">🍃 Today’s quest</div>'
   +(quest? '<h2 style="margin:8px 0 2px;font-size:1.55rem">'+ic(quest.img,quest.icon,'ic-sm')+' '+esc(quest.name)+'</h2>'
    +'<p style="font-weight:800;margin:2px 0 0;color:#2f7a3d">🐸 Frog Quest — quest '+(doneCount+1)+' of 14: we\'re saving a frog tonight, one question at a time!</p>'
    +'<p class="muted" style="font-weight:700;margin:0">'+esc(quest.subName)+' · 5 questions'+((todayPlan.subs.indexOf(quest.sub)>=0||todayPlan.review)?' · <span class="pill done">📅 In today’s plan: '+esc(todayPlan.label)+'</span>':'')+'</p>'
    +'<div style="margin-top:14px"><div style="display:flex;justify-content:space-between;font-weight:800;font-size:.92rem"><span>Quest progress</span><span>'+(qdone?5:qprog)+' / 5</span></div>'
    +'<div class="progressbar" style="margin-top:6px"><div style="width:'+Math.round((qdone?5:qprog)/5*100)+'%"></div></div></div>'
    +(qdone? '<p style="margin-top:14px;background:#e5f4e3;border-radius:16px;padding:12px 14px;font-weight:700;color:#2f7a3d">✔ Quest complete — amazing exploring!</p><p style="font-weight:700;color:#2f7a3d;margin:10px 0 0">A fresh set of questions returns tomorrow morning — or replay today’s set right now if you like!</p><button class="btn" data-quest="'+quest.id+'" style="margin-top:10px">↻ Replay this quest</button>'
      : qfresh? '<p style="margin-top:14px;background:#e5f4e3;border-radius:16px;padding:12px 14px;font-weight:700;color:#2f7a3d">🏆 You finished this one before — today’s fresh set is ready!</p><button class="btn" data-quest="'+quest.id+'" style="margin-top:10px">▶ Start today’s fresh set</button>'
      : '<button class="btn" data-quest="'+quest.id+'" style="margin-top:14px">'+(qprog>0?'Continue the quest':'Start today’s quest')+'</button>')
    +'<p style="margin-top:12px;color:#5b5785;font-weight:600">'+esc(quest.blurb)+'</p>'
    + compass
    +(alt? '<div style="margin-top:14px;border-top:2px dashed #e8e2d0;padding-top:12px"><p style="font-weight:700;color:#6d6899;margin:0 0 8px">Or pick today’s adventure — your call!</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><span class="swapbox" style="background:#e5f4e3;color:#2f7a3d">'+esc(quest.name)+'<span style="display:block;font-size:.75rem;font-weight:700">Today’s pick</span></span><button type="button" class="swapbox" id="swapAlt" style="background:#efe9dc;color:#2a2753;cursor:pointer">'+esc(alt.name)+'<span style="display:block;font-size:.75rem;font-weight:700;color:#6d6899">Swap to this one</span></button></div></div>':'')
    : '<p style="margin-top:8px;font-weight:700">Today’s quest is being planted… check back in a moment.</p>')
   +'</section>';
  if(todayPlan.rest){
    questCard='<section class="questcard"><div class="themeslabel" style="color:#8a6d1f">🌴 Today — rest day</div>'

  var boostTopics=TOPICS.filter(function(t){ var r=(e.boost||{})[t.id]; if(r){ return r.lastScore<3&&r.prevScore!=null&&r.prevScore<3&&!(r.dismissedAt&&r.at&&r.dismissedAt>=r.at)&&!(r.clearedAt&&r.at&&r.clearedAt>=r.at); } return e.stuck&&e.stuck.indexOf(t.id)>=0; }).slice(0,2);

   + boostCard

function bindHome(){
  document.querySelectorAll('[data-theme]').forEach(function(b){ b.onclick=function(){
    var name=b.getAttribute('data-theme'); var e=ex(); if(e.theme!==name){ e.theme=name; e.themeAt=new Date().toISOString(); }
    save(); applyTheme(); sndCorrect();
    toast('Theme changed to '+name+'!'); render();
  }; });
  document.querySelectorAll('[data-home-lvl]').forEach(function(b){ b.onclick=function(){ var e=ex(); e.level=b.getAttribute('data-home-lvl'); e.levelAt=Date.now(); save(); sndCorrect(); toast('Primary level set to '+e.level+' — quests and games will fit you now!'); render(); }; });
  document.querySelectorAll('[data-quest]').forEach(function(b){ b.onclick=function(){ startQuestFlow(b.getAttribute('data-quest')); }; });
  document.querySelectorAll('[data-boost]').forEach(function(b){ b.onclick=function(){ startBoostFlow(b.getAttribute('data-boost')); }; });
  document.querySelectorAll('[data-go2]').forEach(function(b){ b.onclick=function(){ sndPop(); go(b.getAttribute('data-go2')); }; });
  var sw=document.getElementById('swapAlt'); if(sw)sw.onclick=function(){ ex().swapIdx+=1; save(); sndPop(); render(); };
  document.querySelectorAll('[data-mood]').forEach(function(b){ b.onclick=function(){ var e=ex(); if(!e.mood)e.mood={}; e.mood[todayKey()]=b.getAttribute('data-mood'); save(); sndCorrect(); toast('Pip noted how you feel today 💛'); render(); }; });
}

   synced). go('learn') from any other route resets it to the
   subject cards, so the sidebar always lands on the myKx-style
   subject list. */
var learnView={subject:null,openTopic:null};
function mykxSubject(id){ return MYKX_SUBJECTS.find(function(s){ return s.id===id; })||null; }
function mykxTopic(subjId, topicId){ var s=mykxSubject(subjId); if(!s)return null; return s.topics.find(function(t){ return t.id===topicId; })||null; }
/* Distinct questions ready for one myKx topic: the daily pool
   (quest + fresh) of each mapped quest, counted once per quest —
   a quest mapped to two topics (e.g. MRT Numbers) is one set of
   questions, not two. */
function mykxTopicPool(tp, level){ var seen={}, n=0; (tp.quests||[]).forEach(function(qid){ if(seen[qid])return; seen[qid]=1; var t=topicById(qid); if(t)n+=poolQuestions(t, level).length; }); return n; }
function mykxTopicStarted(e, tp){ return (tp.quests||[]).some(function(qid){ return (e.progress&&e.progress[qid])||(e.completed&&e.completed[qid]); }); }
function mykxSubReady(sub, level){ if(!sub.map||sub.cov==='no')return false; if(sub.cov==='p4'&&level<4)return false; var t=topicById(sub.map); return !!t&&poolQuestions(t, level).length>0; }
function mykxSubNote(e, sub, level){
  if(!mykxSubReady(sub, level))return 'Questions on the way';
  if(sub.cov==='partial')return 'Some questions ready';
  /* "Practised" is a per-topic proxy, not per-sub-topic evidence:
     the mapped quest was completed at least once. It never claims a
     sub-topic was mastered on its own. */
  if(e.completed&&e.completed[sub.map])return 'Practised ✓';
  return 'Not yet assessed';
}
/* Subject-card counts, myKx style: "X of N topics started · N
   questions ready". Started = a myKx topic with any mapped quest
   started. Ready = distinct questions across the subject's mapped
   quests (a quest shared by two topics counts once). quests =
   distinct mapped quests — one per session round, 5 questions each. */
function mykxSubjectCounts(e, subj, level){
  var started=0, ready=0, seen={};
  subj.topics.forEach(function(tp){
    if(mykxTopicStarted(e, tp))started++;
    (tp.quests||[]).forEach(function(qid){ if(seen[qid])return; seen[qid]=1; var t=topicById(qid); if(t)ready+=poolQuestions(t, level).length; });
  });
  return {started:started, total:subj.topics.length, ready:ready, quests:Object.keys(seen).length};
}
/* First quest of today's session: the first distinct mapped quest
   (myKx topic order) not finished today; if all are done, the first
   one again (a replay). */
function mykxSessionFirst(e, subj, level){
  var day=todayKey(), cands=[];
  subj.topics.forEach(function(tp){ (tp.quests||[]).forEach(function(qid){ if(cands.indexOf(qid)<0)cands.push(qid); }); });
  if(!cands.length)return null;
  var open=cands.filter(function(qid){ return !(e.completedDay&&e.completedDay[qid]===day); });
  return open[0]||cands[0];
}

/* ---------- Daily fresh-set engine ----------
   poolQuestions: the questions a daily fresh set may draw from —
   the topic's quest questions plus its fresh bank. Warm-up and
   Second Chance banks are deliberately NOT in the pool, so they
   never repeat quest questions. rotateIndices splits a bank into
   fixed groups and rotates one group per day (requested 2026-11-07
   — the old random draw shared ~2 questions with yesterday, and a
   topic with only 5 questions in its pool repeated all 5 every
   day): consecutive days are always disjoint, and with 15 in the
   pool the same group only returns after 3 days. Once a set is
   started it is stored in the quest's saved progress, so an
   unfinished quest keeps that exact set across days, untouched. */
var LEVELS=['P1','P2','P3','P4','P5','P6'];
function levelNum(e){ var n=parseInt((e&&e.level||'').replace('P',''),10); return (n>=1&&n<=6)?n:3; }
function levelTier(e){ var n=levelNum(e); return n<=2?'low':(n<=4?'mid':'high'); }
function bankFor(t, kind, level){
  /* P4 banks landed 2026-11-07 (merge-p4.js): level 4+ reads the
     p4<kind> arrays on the topic; P1–P3, and any kind without a
     P4 bank, still read today's P3 bank. */
  var lv=(typeof level==='number'&&level>=1)?level:3;
  if(lv>=4){ var p4=t['p4'+kind]; if(p4&&p4.length)return p4; }
  return t[kind]||[];
}
function poolQuestions(t, level){ return bankFor(t,'quest',level).concat(bankFor(t,'fresh',level)); }
function hashStr(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function seededShuffle(arr, seed){ var a=arr.slice(), s=(seed>>>0)||1; function rnd(){ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; } for(var i=a.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var tmp=a[i]; a[i]=a[j]; a[j]=tmp; } return a; }
function dateKeyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function rotateIndices(n, dayStr, salt, take){
  take=Math.min(take,n);
  if(n<=0)return [];
  var all=[]; for(var i=0;i<n;i++)all.push(i);
  if(n<=take)return seededShuffle(all, hashStr(salt+'|'+dayStr));

function boostListFor(t, level, explorerId, dayStr){

     last 2 are fresh questions on the same topic (fresh bank). Both
     draws are seeded by day + topic + explorer, so a re-render never
     re-draws mid-drill and a second boost the same day is a different
     set. No procedural/code-generated questions here: Learn has no
     procedural generator today (genRound is a Play-games generator),

     already does. A procedural Maths generator is the recommended
     follow-up if bank burn becomes the bottleneck. */

       topic. A good run (>=3/5) un-flags it. The record is never
       deleted (a delete does not sync); clearing is a clearedAt
       timestamp, dismissing is a dismissedAt timestamp, and a fresh
       flag after either gets a new at. e.stuckCount/e.stuck are
       legacy now — nothing reads stuckCount any more, and e.stuck
       is only reconciled by the merge. */

   best-ever (kept across days), stored per explorer as

function fmtPlaySecs(s){ s=Math.max(0,Math.round(s||0)); var m=Math.floor(s/60), r=s%60; return m>0?(m+'m '+String(r).padStart(2,'0')+'s'):(s+'s'); }
/* Answer-only timing (requested 2026-11-07): the clock counts only
   the time a question is on screen waiting for an answer.
   gState.answerSecs banks the seconds already spent answering;
   gState.startedAt is the moment the current question appeared
   (null while the answer is showing and the clock is paused).
   Memory Match and Exit Parking are continuous play, so they
   never pause — startedAt stays set for the whole run. */
function playElapsedSecs(){
  if(!gState)return 0;
  var base=gState.answerSecs||0;
  if(gState.startedAt)base+=Math.max(0,(Date.now()-gState.startedAt)/1000);
  return Math.round(base);
}
function pausePlayTimer(){
  if(!gState||!gState.startedAt)return;
  gState.answerSecs=playElapsedSecs();
  gState.startedAt=null;
}
function resumePlayTimer(){
  if(!gState||gState.startedAt)return;
  gState.startedAt=Date.now();
}
/* The game timer chip ticks every second while a game is open —
   it used to sit at 0s until the first tap, because the chip only
   re-rendered on an interaction (seen live 2026-11-07). While the
   clock is paused the chip keeps showing the frozen total (the
   interval must NOT clear — Next resumes it). The interval clears
   itself the moment the chip is gone (game finished, Back pressed,
   or route changed). */
function tickGameTime(){
  var el=document.getElementById('gameTime');
  if(!el||!gState){ if(gameTimer){clearInterval(gameTimer);gameTimer=null;} return; }
  el.textContent='⏱ '+fmtPlaySecs(playElapsedSecs());
  /* Maths Race: the 1s tick also drives the per-question countdown
     and the rival's progress — raceTick is a no-op for other games,
     and the typeof guard keeps the standalone test harness (which
     evals tickGameTime alone) working. */
  if(gState.id==='race'&&typeof raceTick==='function')raceTick();
}
/* Maths Race countdown + rival, driven by the 1s tickGameTime.
   The rival (Turbo the Turtle) advances with the answer-only clock
   — one cell every 4 seconds — while the child advances by getting
   answers right. The 10s countdown bar drains each second; at 0 the
   round counts as a wrong answer (no tap needed). All of this is
   session-only: gState.raceDeadline is never saved. */
function raceSecsLeft(deadline){ return Math.max(0,Math.ceil((deadline-Date.now())/1000)); }
function raceRivalPos(elapsedSecs){ return Math.min(10,Math.floor((elapsedSecs||0)/4)); }
function raceChildPos(score){ return Math.min(10,Math.round((score||0)/6*10)); }
function raceTrackHTML(e){
  var left=gState.raceDeadline?raceSecsLeft(gState.raceDeadline):10;
  var cp=raceChildPos(gState.score), rp=raceRivalPos(playElapsedSecs());

   +'<div class="racebar"><div class="racebarfill" id="raceBarFill" style="width:'+(left*10)+'%"></div></div>'
   +'<div class="racelane"><span class="racelab">You</span><span class="racer" style="left:'+(cp*9)+'%">'+(e&&e.face?e.face:'🦦')+'</span><span class="raceflag">🏁</span></div>'
   +'<div class="racelane"><span class="racelab">Turbo 🐢</span><span class="racer" id="raceRival" style="left:'+(rp*9)+'%">🐢</span><span class="raceflag">🏁</span></div></div>';
}
function raceTick(){
  if(!gState||gState.id!=='race'||(typeof route!=='undefined'&&route!=='game'))return;
  var dl=gState.raceDeadline;
  if(dl&&!gState.answered){
    var left=raceSecsLeft(dl);
    var fill=document.getElementById('raceBarFill'); if(fill)fill.style.width=Math.max(0,left*10)+'%';
    var secs=document.getElementById('raceSecs'); if(secs)secs.textContent=left+'s';
    if(left<=3&&gState.raceLastTick!==left){ gState.raceLastTick=left; sndTick(12-left); }
    if(left<=0){
      gState.picked=-1; gState.answered=true; gState.timedOut=true; gState.streak=0; gState.raceDeadline=null;
      sndWrong(); pausePlayTimer(); saveGameProgress(); render();
      return;
    }
  }
  var rv=document.getElementById('raceRival');
  if(rv)rv.style.left=(raceRivalPos(playElapsedSecs())*9)+'%';

/* Stops the answer-only timer (playElapsedSecs) and keeps the run
   only if it beats the stored best. Also stashes the run's time on
   gState.lastSecs for the completion screen. Returns true when the
   run just set a new fastest time. */
function recordPlayBest(e, gameId){
  /* No timing at all (never started, or a blank state) records
     nothing — a paused run still counts, because its seconds are
     banked in answerSecs. */
  if(!gState||(!gState.startedAt&&!(gState.answerSecs>0)))return false;
  var secs=Math.max(1,playElapsedSecs());
  gState.lastSecs=secs;
  if(!e.playBest)e.playBest={};
  var cur=e.playBest[gameId];
  if(!cur||secs<cur.secs){ e.playBest[gameId]={secs:secs, day:todayKey()}; return true; }
  return false;
}

function friendsApi(action, body){

}

   in one session — no multiple-choice rounds. The child taps a
   square to pick a word (tap the SAME square again to switch
   between its Across and Down word), types the word with the
   keyboard, and the word is checked whole: green when right (the

     letter — drop it. The rest fill the unlocked cells in order.

function bindGame(){
  /* Completion awards resolve the explorer FRESH (ex()) at the
     moment of the award — never through a variable captured when
     bindGame ran. A 30s auto-pull merges the DB and replaces every
     explorer object, so a captured explorer is detached: stars and
     best times written through it are lost on the next save (seen
     live 2026-11-07: Exit Parking stars never counted, and 8 of 9
     best times never reached the arcade cards). The award and the
     save below are synchronous, so no merge can slip between them. */
  var back=document.getElementById('gBack'); if(back)back.onclick=function(){ gState=null; go('play'); };
  var quit=document.getElementById('gQuit'); if(quit)quit.onclick=function(){ if(gState&&gState.escapeTimer){ clearTimeout(gState.escapeTimer); gState.escapeTimer=null; } saveGameProgress(); toast('Saved! Tap the game anytime to resume.'); gState=null; go('play'); };
  if(gState.id==='parking'){
    if(gState.idx>=gState.rounds)return;
    var lv=PARKLEVELS[gState.idx]||PARKLEVELS[0];
    /* A resumed lot that is already won (quit on the overlay edge
       case) advances at once instead of leaving a stuck board. */
    if(parkWon(gState.cars, lv)){
      gState.score++; gState.idx++;
      if(gState.idx<gState.rounds){ gState.cars=PARKLEVELS[gState.idx].cars.map(function(c){ return {id:c.id,e:c.e,o:c.o,x:c.x,y:c.y,len:c.len,bg:c.bg}; }); }
      saveGameProgress(); render(); return;
    }
    if(!gState.parkHist)gState.parkHist=[];
    if(!gState.parkWinToken)gState.parkWinToken=0;
    document.querySelectorAll('[data-car]').forEach(function(b){ b.onclick=function(ev){
      if(gState.parkBusy)return;
      var id=b.getAttribute('data-car');
      var car=null; gState.cars.forEach(function(c){ if(c.id===id)car=c; }); if(!car)return;
      /* Direction from WHERE on the car the child tapped (left/right
         half, top/bottom half) — never from data-cx/data-cy, which
         go stale the moment a car slides without a re-render. */
      var r=b.getBoundingClientRect();
      var dir;
      if(car.o==='h'){ dir=((ev.clientX-r.left)/r.width>0.5)?'r':'l'; }
      else { dir=((ev.clientY-r.top)/r.height>0.5)?'d':'u'; }
      var moved=parkMove(gState.cars, id, dir, lv);
      /* No opposite-direction fallback any more: a blocked move is
         a thunk + a shake, and the child picks another car. */
      if(!moved){ sndThunk(); b.classList.add('parkshake'); setTimeout(function(){ b.classList.remove('parkshake'); },320); return; }
      gState.parkHist.push(JSON.parse(JSON.stringify(gState.cars))); if(gState.parkHist.length>50)gState.parkHist.shift();
      gState.cars=moved; gState.moves++; sndSlide(); saveGameProgress();
      /* Slide, don't teleport: move just this car's element (the
         CSS transition animates it) and update the moves chip —
         no full re-render on a move. */
      var nc=null; moved.forEach(function(c){ if(c.id===id)nc=c; });
      if(nc){ var cw=100/lv.w, ch=100/lv.h; b.style.left=(nc.x*cw)+'%'; b.style.top=(nc.y*ch)+'%'; }
      var mc=document.getElementById('parkMoves'); if(mc)mc.textContent='Moves: '+gState.moves;
      if(parkWon(gState.cars, lv)){
        gState.parkBusy=true;
        var stars=parkLevelStars(gState.moves, lv.par);

     20s abort in the code (and a stuck reply wedged the whole

    var eNow=ex(); if(!eNow)return;

    /* If the active thread no longer exists (e.g. it was cleared on
       another device), do not crash silently on th.msgs — send the
       user back to the chat list instead of doing nothing. */
    if(!th){ toast('That chat is gone — start a new chat first.'); activeThread=null; render(); return; }
    th.msgs.push({who:'kid', text:v});
    if(th.title.indexOf('New chat')===0)th.title=v.length>34?v.slice(0,34)+'…':v;

    /* The thinking bubble is UI state only (asking[threadId]): it is

       synced. The old code stored it as a message, so a sync merge
       resurrected it forever — the reply arrived, but "Pip is
       thinking…" stayed on screen beside it. The reply is found by
       this thread's own id, not the active thread, so it lands in
       the chat it was asked in even if the child switched chats. */
    asking[th.id]=v;
    save(); render();
    var log=document.getElementById('chatlog'); if(log)log.scrollTop=log.scrollHeight;
    askPipLive(v, hist, eNow.name).then(function(live){
      delete asking[th.id];

         while Pip was answering, and the reply must land in the
         live database, not the detached copy. */
      var eLive=ex(); var th2=eLive?eLive.threads.find(function(t){return t.id===th.id;}):null;
      if(!th2){ save(); render(); return; }
      if(live){ th2.msgs.push({who:'pip', text:live.reply, skill:live.skillName||'', skillId:live.skillId||'', agent:live.agentName||'', agentId:live.agentId||'', signature:live.signature||'', hintFirst:!!live.hintFirst, live:true}); }

      try{
